name: Apply crash stability patch
# final rerun: eliminate zero-speed free-wheel reaction-torque chatter

on:
  push:
    branches:
      - agent/full-tire-combined-slip
    paths:
      - .github/workflows/agent-crash-stability-patch.yml
      - src/physics/tests/CrashStabilityTests.ts
      - src/physics/tests/CrashRecoveryTests.ts

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-tire-combined-slip
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch root-cause crash physics and body rendering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vehicle = Path('src/physics/Vehicle.ts')
          text = vehicle.read_text()
          import_marker = "import { ISurfaceProvider, ProvingGroundSurfaceProvider } from './SurfaceProvider';\n\n"
          helper = import_marker + "export function projectTireShearOntoSurface(forceWorld: Vec3, surfaceNormal: Vec3): Vec3 {\n  const normal = PhysicsMath.vec3Normalize(surfaceNormal);\n  if (PhysicsMath.vec3Length(normal) < 1e-7) return forceWorld;\n  const normalForce = PhysicsMath.vec3Dot(forceWorld, normal);\n  return PhysicsMath.vec3Sub(forceWorld, PhysicsMath.vec3Scale(normal, normalForce));\n}\n\n"
          if 'export function projectTireShearOntoSurface' not in text:
              if import_marker not in text:
                  raise SystemExit('Vehicle import marker not found')
              text = text.replace(import_marker, helper, 1)

          old_force = """      if (!suspState.isAirborne && suspState.tireNormalForceN > 0) {\n        // Convert tire planar forces (Fx along wheel heading, Fy lateral to wheel) back into body frame.\n        const fxBody = tireOut.fy * cosS + tireOut.fx * sinS;\n        const fzBody = -tireOut.fy * sinS + tireOut.fx * cosS;\n\n        // Tire shear follows the chassis/wheel heading, but suspension support is\n        // an external ground-normal reaction. Rotating support with chassis pitch/roll\n        // can invent propulsion on a flat road; apply it along the actual road normal.\n        const tirePlanarWorld = PhysicsMath.quatRotateVec3(\n          this.rigidBody.orientation,\n          PhysicsMath.vec3(fxBody, 0, fzBody)\n        );\n        const suspensionSupportWorld = PhysicsMath.vec3Scale(\n          surface.normal,\n          suspState.chassisForceN\n        );\n        const contactForceWorld = PhysicsMath.vec3Add(tirePlanarWorld, suspensionSupportWorld);\n        this.rigidBody.addWorldForceAtPoint(contactForceWorld, contactWorld);\n\n        // Apply self-aligning torque Mz to chassis\n        this.rigidBody.addBodyTorque(PhysicsMath.vec3(0, tireOut.aligningTorque, 0));\n      }\n"""
          new_force = """      const roadNormal = PhysicsMath.vec3Normalize(surface.normal);\n      const bodyUpWorld = PhysicsMath.quatRotateVec3(\n        this.rigidBody.orientation,\n        PhysicsMath.vec3(0, 1, 0)\n      );\n      const contactUprightness = PhysicsMath.vec3Dot(bodyUpWorld, roadNormal);\n      const wheelContactAuthority = PhysicsMath.clamp(\n        (contactUprightness - 0.20) / 0.45,\n        0,\n        1\n      );\n\n      if (!suspState.isAirborne && suspState.tireNormalForceN > 0 && wheelContactAuthority > 0.001) {\n        const fxBody = tireOut.fy * cosS + tireOut.fx * sinS;\n        const fzBody = -tireOut.fy * sinS + tireOut.fx * cosS;\n        const rawTireShearWorld = PhysicsMath.quatRotateVec3(\n          this.rigidBody.orientation,\n          PhysicsMath.vec3(fxBody, 0, fzBody)\n        );\n        const tirePlanarWorld = PhysicsMath.vec3Scale(\n          projectTireShearOntoSurface(rawTireShearWorld, roadNormal),\n          wheelContactAuthority\n        );\n\n        // RigidBody.mass is the complete vehicle mass. The external support on it\n        // is therefore the road/tire normal reaction, not the internal spring force.\n        const suspensionSupportWorld = PhysicsMath.vec3Scale(\n          roadNormal,\n          suspState.tireNormalForceN * wheelContactAuthority\n        );\n        const contactForceWorld = PhysicsMath.vec3Add(tirePlanarWorld, suspensionSupportWorld);\n        this.rigidBody.addWorldForceAtPoint(contactForceWorld, contactWorld);\n        this.rigidBody.addBodyTorque(\n          PhysicsMath.vec3(0, tireOut.aligningTorque * wheelContactAuthority, 0)\n        );\n      }\n"""
          if old_force not in text:
              raise SystemExit('Vehicle tire-force target block not found')
          vehicle.write_text(text.replace(old_force, new_force, 1))

          wheel = Path('src/physics/WheelDynamics.ts')
          text = wheel.read_text()
          old_patch = """    const patchSlipSpeed = Math.hypot(longPatchSlipSpeed, lateralVelocity);\n    const lowSpeedSlideBlend = PhysicsMath.clamp((patchSlipSpeed - 0.15) / 0.85, 0, 1);\n"""
          new_patch = """    const patchSlipSpeed = Math.hypot(longPatchSlipSpeed, lateralVelocity);\n\n    // Rubber shear from a completed spin relaxes over time once there is no longer\n    // meaningful contact-patch motion or applied axle torque. This prevents old\n    // bristle deflection from becoming a persistent low-speed oscillation source.\n    const patchNearlySettled =\n      fz >= 20 &&\n      rollingSpeed < 0.55 &&\n      patchSlipSpeed < 0.28 &&\n      Math.abs(driveTorque) < 15 &&\n      brakeRequest < 15;\n    if (patchNearlySettled) {\n      const creepDecay = Math.exp(-dt / 0.35);\n      this.lowSpeedLongDeflection *= creepDecay;\n      this.lowSpeedLatDeflection *= creepDecay;\n    }\n\n    const lowSpeedSlideBlend = PhysicsMath.clamp((patchSlipSpeed - 0.15) / 0.85, 0, 1);\n"""
          if old_patch not in text:
              raise SystemExit('WheelDynamics contact-patch marker not found')
          text = text.replace(old_patch, new_patch, 1)

          old_sync = """    if (Math.abs(longitudinalVelocity) < 1.0 && Math.abs(driveTorque) < 15 && brakeRequest < 15) {\n      const sync = 1 - Math.exp(-14 * dt);\n      this.angularVelocity += (roadOmega - this.angularVelocity) * sync;\n    }\n\n    this.rotationAngle += this.angularVelocity * dt;\n"""
          new_sync = """    if (Math.abs(longitudinalVelocity) < 1.0 && Math.abs(driveTorque) < 15 && brakeRequest < 15) {\n      const sync = 1 - Math.exp(-14 * dt);\n      this.angularVelocity += (roadOmega - this.angularVelocity) * sync;\n    }\n\n    // A freely rolling loaded wheel at essentially zero chassis speed is a static\n    // no-slip constraint. Letting a several-kN residual tire force integrate through\n    // the tiny wheel inertia can kick omega by multiple rad/s every 120 Hz step,\n    // creating a numerical reaction-torque chatter after a spin. Project only this\n    // quiescent, unpowered/unbraked case to the road speed; genuine acceleration,\n    // braking, wheelspin and rolling behavior are unaffected.\n    const quiescentFreeRolling =\n      fz >= 20 &&\n      Math.abs(longitudinalVelocity) < 0.35 &&\n      Math.abs(lateralVelocity) < 0.25 &&\n      Math.abs(driveTorque) < 15 &&\n      brakeRequest < 15;\n    if (quiescentFreeRolling) {\n      this.angularVelocity = roadOmega;\n      const slipStateDecay = Math.exp(-dt / 0.10);\n      this.rawSlipRatio *= slipStateDecay;\n      this.relaxationSlipRatio *= slipStateDecay;\n    }\n\n    this.rotationAngle += this.angularVelocity * dt;\n"""
          if old_sync not in text:
              raise SystemExit('WheelDynamics low-speed sync target not found')
          wheel.write_text(text.replace(old_sync, new_sync, 1))

          renderer = Path('src/graphics/carRenderer.ts')
          text = renderer.read_text()
          old_prop = "  public rootGroup: THREE.Group;\n  public chassisGroup: THREE.Group;"
          new_prop = "  public rootGroup: THREE.Group;\n  public chassisPivotGroup: THREE.Group;\n  public chassisGroup: THREE.Group;"
          if old_prop not in text:
              raise SystemExit('carRenderer property marker not found')
          text = text.replace(old_prop, new_prop, 1)

          old_ctor = """    this.rootGroup = new THREE.Group();\n    this.chassisGroup = new THREE.Group();\n    this.rootGroup.add(this.chassisGroup);\n"""
          new_ctor = """    this.rootGroup = new THREE.Group();\n    this.chassisPivotGroup = new THREE.Group();\n    this.chassisPivotGroup.rotation.order = 'YXZ';\n    this.chassisGroup = new THREE.Group();\n    this.chassisPivotGroup.add(this.chassisGroup);\n    this.rootGroup.add(this.chassisPivotGroup);\n"""
          if old_ctor not in text:
              raise SystemExit('carRenderer constructor marker not found')
          text = text.replace(old_ctor, new_ctor, 1)

          old_update = """    // 1. Root Group tracks World Position and Heading Yaw\n    // Root follows local road elevation. Chassis heave below is terrain-relative,\n    // preventing world altitude from being applied twice on hills/crests.\n    this.rootGroup.position.set(state.x, state.elevationHeight, state.z);\n    this.rootGroup.rotation.y = state.yaw;\n\n    // 2. Suspended Chassis Group with Dynamic Body Roll, Pitch, and Heave\n    this.chassisGroup.position.y = state.heave;\n    this.chassisGroup.rotation.z = state.roll;\n    this.chassisGroup.rotation.x = state.pitch;\n"""
          new_update = """    this.rootGroup.position.set(state.x, state.elevationHeight, state.z);\n    this.rootGroup.rotation.y = state.yaw;\n\n    // The visual shell rotates around the same CG used by the rigid body instead of\n    // orbiting around road level during a wipeout.\n    const chassisCgOffset = config.centerOfGravityHeight + 0.35;\n    this.chassisPivotGroup.position.set(0, state.heave + chassisCgOffset, 0);\n    this.chassisPivotGroup.rotation.set(state.pitch, 0, state.roll, 'YXZ');\n    this.chassisGroup.position.set(0, -chassisCgOffset, 0);\n    this.chassisGroup.rotation.set(0, 0, 0);\n"""
          if old_update not in text:
              raise SystemExit('carRenderer update marker not found')
          renderer.write_text(text.replace(old_update, new_update, 1))
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Crash and spin stability regression
        run: npm run test:crash

      - name: Root-cause crash recovery regression
        run: npm run test:crash-recovery

      - name: Existing tire and vehicle regressions
        run: |
          npm run test:tire
          npm run test:stationary
          npm run test:suspension
          npm run test:corner-load
          npm run test:smoke
          npm run test:mobile

      - name: Production build
        run: npm run build

      - name: Commit tested fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/agent-crash-stability-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/Vehicle.ts src/physics/WheelDynamics.ts src/graphics/carRenderer.ts .github/workflows/agent-crash-stability-patch.yml
          git commit -m "Fix spinout shake and wipeout separation"
          git push origin HEAD:agent/full-tire-combined-slip
