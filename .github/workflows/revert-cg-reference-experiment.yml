name: Restore proven vehicle reference geometry

on:
  push:
    branches:
      - agent/anti-roll-bars
    paths:
      - .github/workflows/revert-cg-reference-experiment.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/anti-roll-bars
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore reference geometry but retain signed ARB forces
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:90]!r}')
              p.write_text(text.replace(old, new, 1))

          vehicle = 'src/physics/Vehicle.ts'
          replace_once(
              vehicle,
              "\n// Suspension top mounts sit above the physical CG. Keeping this offset in the\n// hardpoint geometry lets RigidBody.position remain the true center of mass.\nexport const SUSPENSION_PICKUP_HEIGHT_ABOVE_CG_M = 0.35;\n",
              ""
          )
          replace_once(vehicle, "      PhysicsMath.vec3(0, H, 0),", "      PhysicsMath.vec3(0, H + 0.35, 0),")
          replace_once(vehicle, "    this.rigidBody.position = PhysicsMath.vec3(x, H, z);", "    this.rigidBody.position = PhysicsMath.vec3(x, H + 0.35, z);")
          replace_once(
              vehicle,
              "      PhysicsMath.vec3(W, SUSPENSION_PICKUP_HEIGHT_ABOVE_CG_M, frontDist),  // FL\n      PhysicsMath.vec3(-W, SUSPENSION_PICKUP_HEIGHT_ABOVE_CG_M, frontDist), // FR\n      PhysicsMath.vec3(W, SUSPENSION_PICKUP_HEIGHT_ABOVE_CG_M, -rearDist),  // RL\n      PhysicsMath.vec3(-W, SUSPENSION_PICKUP_HEIGHT_ABOVE_CG_M, -rearDist), // RR",
              "      PhysicsMath.vec3(W, 0, frontDist),  // FL\n      PhysicsMath.vec3(-W, 0, frontDist), // FR\n      PhysicsMath.vec3(W, 0, -rearDist),  // RL\n      PhysicsMath.vec3(-W, 0, -rearDist), // RR"
          )
          replace_once(
              vehicle,
              "      heave: pos.y - cgSurface.elevation - this.config.centerOfGravityHeight,",
              "      heave: pos.y - cgSurface.elevation - (this.config.centerOfGravityHeight + 0.35),"
          )

          replace_once(
              'src/graphics/carRenderer.ts',
              "    const chassisCgOffset = config.centerOfGravityHeight;",
              "    const chassisCgOffset = config.centerOfGravityHeight + 0.35;"
          )
          replace_once(
              'src/physics/tests/CrashRecoveryTests.ts',
              "  const cgOffset = config.centerOfGravityHeight;",
              "  const cgOffset = config.centerOfGravityHeight + 0.35;"
          )

          Path('.github/workflows/revert-cg-reference-experiment.yml').unlink()
          PY
      - run: npm install --no-audit --no-fund
      - name: Verify restored equilibrium
        run: |
          npm run test:stationary
          npm run test:suspension
          npm run test:crash-recovery
      - name: Commit restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/Vehicle.ts src/graphics/carRenderer.ts src/physics/tests/CrashRecoveryTests.ts .github/workflows/revert-cg-reference-experiment.yml
          git commit -m "Restore stable vehicle reference geometry"
          git push origin HEAD:agent/anti-roll-bars
