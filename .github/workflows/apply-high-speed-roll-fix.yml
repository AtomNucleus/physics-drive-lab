name: Apply high-speed roll geometry fix

on:
  push:
    branches:
      - agent/anti-roll-bars
    paths:
      - .github/workflows/apply-high-speed-roll-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/anti-roll-bars
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct CG geometry and anti-roll force conservation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          vehicle = 'src/physics/Vehicle.ts'
          replace_once(
              vehicle,
              "import { ISurfaceProvider, ProvingGroundSurfaceProvider } from './SurfaceProvider';\n",
              "import { ISurfaceProvider, ProvingGroundSurfaceProvider } from './SurfaceProvider';\n\n// Suspension top mounts sit above the physical CG. Keeping this offset in the\n// hardpoint geometry lets RigidBody.position remain the true center of mass.\nexport const SUSPENSION_PICKUP_HEIGHT_ABOVE_CG_M = 0.35;\n"
          )
          replace_once(
              vehicle,
              "      PhysicsMath.vec3(0, H + 0.35, 0),",
              "      PhysicsMath.vec3(0, H, 0),"
          )
          replace_once(
              vehicle,
              "    this.rigidBody.position = PhysicsMath.vec3(x, H + 0.35, z);",
              "    this.rigidBody.position = PhysicsMath.vec3(x, H, z);"
          )
          replace_once(
              vehicle,
              "      PhysicsMath.vec3(W, 0, frontDist),  // FL\n      PhysicsMath.vec3(-W, 0, frontDist), // FR\n      PhysicsMath.vec3(W, 0, -rearDist),  // RL\n      PhysicsMath.vec3(-W, 0, -rearDist), // RR",
              "      PhysicsMath.vec3(W, SUSPENSION_PICKUP_HEIGHT_ABOVE_CG_M, frontDist),  // FL\n      PhysicsMath.vec3(-W, SUSPENSION_PICKUP_HEIGHT_ABOVE_CG_M, frontDist), // FR\n      PhysicsMath.vec3(W, SUSPENSION_PICKUP_HEIGHT_ABOVE_CG_M, -rearDist),  // RL\n      PhysicsMath.vec3(-W, SUSPENSION_PICKUP_HEIGHT_ABOVE_CG_M, -rearDist), // RR"
          )
          replace_once(
              vehicle,
              "      heave: pos.y - cgSurface.elevation - (this.config.centerOfGravityHeight + 0.35),",
              "      heave: pos.y - cgSurface.elevation - this.config.centerOfGravityHeight,"
          )

          suspension = 'src/physics/Suspension.ts'
          replace_once(
              suspension,
              "        (tireForces[i] - Math.max(0, chassisForces[i])) / unsprungMassKg;",
              "        (tireForces[i] - chassisForces[i]) / unsprungMassKg;"
          )
          replace_once(
              suspension,
              "      let chassisForce = Math.max(\n        0,\n        springForce + damperForce + bumpStopForce + antiRollContribution\n      );",
              "      // Coil/damper support cannot pull the chassis below zero on its own,\n      // but an anti-roll bar is a torsional member and absolutely can apply a\n      // downward reaction at the inside corner. Preserve that signed reaction so\n      // the opposite ARB forces remain equal-and-opposite instead of clipping one\n      // side and creating artificial heave/jacking.\n      const baseChassisForce = Math.max(0, springForce + damperForce + bumpStopForce);\n      let chassisForce = baseChassisForce + antiRollContribution;"
          )

          renderer = 'src/graphics/carRenderer.ts'
          replace_once(
              renderer,
              "    const chassisCgOffset = config.centerOfGravityHeight + 0.35;",
              "    const chassisCgOffset = config.centerOfGravityHeight;"
          )

          recovery = 'src/physics/tests/CrashRecoveryTests.ts'
          replace_once(
              recovery,
              "  const cgOffset = config.centerOfGravityHeight + 0.35;",
              "  const cgOffset = config.centerOfGravityHeight;"
          )

          # The patch workflow is temporary; delete itself so it never becomes part
          # of the final PR and cannot retrigger on later physics commits.
          Path('.github/workflows/apply-high-speed-roll-fix.yml').unlink()
          PY
      - run: npm install --no-audit --no-fund
      - name: Validate suspension and crash geometry
        run: |
          npm run test:suspension
          npm run test:crash-recovery
      - name: Commit corrected physics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/Vehicle.ts src/physics/Suspension.ts src/graphics/carRenderer.ts src/physics/tests/CrashRecoveryTests.ts .github/workflows/apply-high-speed-roll-fix.yml
          git commit -m "Correct physical CG and anti-roll force conservation"
          git push origin HEAD:agent/anti-roll-bars
