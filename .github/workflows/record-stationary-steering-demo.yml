name: Record stationary steering demo

on:
  push:
    branches:
      - agent/record-stationary-steering-demo
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build simulator
        run: npm run build

      - name: Start simulator
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/physics-drive-vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/physics-drive-vite.log
          exit 1

      - name: Record full-lock visual test
        run: |
          mkdir -p artifacts/raw
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { copyFile } from 'node:fs/promises';

          const browser = await chromium.launch({
            headless: true,
            args: ['--use-gl=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'],
          });
          const context = await browser.newContext({
            viewport: { width: 1280, height: 720 },
            recordVideo: {
              dir: 'artifacts/raw',
              size: { width: 1280, height: 720 },
            },
          });
          const page = await context.newPage();
          await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' });
          await page.locator('canvas').waitFor({ state: 'visible' });

          await page.evaluate(() => {
            const label = document.createElement('div');
            label.id = 'recording-test-label';
            Object.assign(label.style, {
              position: 'fixed',
              left: '24px',
              bottom: '24px',
              zIndex: '99999',
              padding: '12px 16px',
              borderRadius: '10px',
              background: 'rgba(0,0,0,0.72)',
              color: 'white',
              font: '600 18px system-ui, sans-serif',
              letterSpacing: '0.01em',
              pointerEvents: 'none',
            });
            label.textContent = '2025 BMW M5 — stationary steering regression';
            document.body.appendChild(label);
          });

          // Give suspension and camera time to settle.
          await page.waitForTimeout(2500);

          // Switch from chase to orbit camera and move to a front-quarter/side view.
          for (let i = 0; i < 5; i++) {
            await page.keyboard.press('c');
            await page.waitForTimeout(180);
          }
          const canvas = page.locator('canvas');
          const box = await canvas.boundingBox();
          if (box) {
            const cx = box.x + box.width * 0.52;
            const cy = box.y + box.height * 0.52;
            await page.mouse.move(cx, cy);
            await page.mouse.down();
            await page.mouse.move(cx + 245, cy - 20, { steps: 25 });
            await page.mouse.up();
          }
          await page.waitForTimeout(1200);

          const setLabel = async (text) => {
            await page.evaluate((t) => {
              const el = document.getElementById('recording-test-label');
              if (el) el.textContent = t;
            }, text);
          };

          await setLabel('FULL LEFT — car should remain at 0 mph, no smoke');
          await page.keyboard.down('ArrowLeft');
          await page.waitForTimeout(3500);
          await page.keyboard.up('ArrowLeft');

          await setLabel('CENTER — checking for residual shake / creep');
          await page.waitForTimeout(1800);

          await setLabel('FULL RIGHT — car should remain at 0 mph, no smoke');
          await page.keyboard.down('ArrowRight');
          await page.waitForTimeout(3500);
          await page.keyboard.up('ArrowRight');

          await setLabel('CENTER — test complete');
          await page.waitForTimeout(1800);

          const video = page.video();
          await context.close();
          if (!video) throw new Error('Playwright did not create a video');
          const rawPath = await video.path();
          await copyFile(rawPath, 'artifacts/stationary-steering-test.webm');
          await browser.close();
          JS

      - name: Convert recording to MP4
        run: |
          ffmpeg -y -i artifacts/stationary-steering-test.webm \
            -c:v libx264 -preset medium -crf 21 -pix_fmt yuv420p -movflags +faststart \
            artifacts/stationary-steering-test.mp4
          ls -lh artifacts/stationary-steering-test.*

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: stationary-steering-test-video
          path: |
            artifacts/stationary-steering-test.mp4
            artifacts/stationary-steering-test.webm
          if-no-files-found: error
          retention-days: 7
