name: Record stationary steering demo

on:
  push:
    branches:
      - agent/record-stationary-steering-demo
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build simulator
        run: npm run build

      - name: Start simulator
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/physics-drive-vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/physics-drive-vite.log
          exit 1

      - name: Record full-lock visual test
        run: |
          mkdir -p artifacts/raw
          timeout 45s node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { copyFile } from 'node:fs/promises';

          const browser = await chromium.launch({
            headless: true,
            args: [
              '--use-gl=swiftshader',
              '--enable-unsafe-swiftshader',
              '--enable-webgl',
              '--ignore-gpu-blocklist',
              '--disable-dev-shm-usage',
            ],
          });
          const context = await browser.newContext({
            viewport: { width: 1280, height: 720 },
            recordVideo: {
              dir: 'artifacts/raw',
              size: { width: 1280, height: 720 },
            },
          });
          context.setDefaultTimeout(15000);
          const page = await context.newPage();
          page.on('console', (msg) => console.log(`[browser:${msg.type()}] ${msg.text()}`));
          page.on('pageerror', (err) => console.error(`[browser:error] ${err.message}`));

          await page.goto('http://127.0.0.1:4173', {
            waitUntil: 'domcontentloaded',
            timeout: 15000,
          });
          await page.locator('canvas').waitFor({ state: 'attached', timeout: 15000 });
          await page.waitForTimeout(3000);

          await page.evaluate(() => {
            const label = document.createElement('div');
            label.id = 'recording-test-label';
            Object.assign(label.style, {
              position: 'fixed',
              left: '24px',
              bottom: '24px',
              zIndex: '99999',
              padding: '12px 16px',
              borderRadius: '10px',
              background: 'rgba(0,0,0,0.72)',
              color: 'white',
              font: '600 18px system-ui, sans-serif',
              letterSpacing: '0.01em',
              pointerEvents: 'none',
            });
            label.textContent = '2025 BMW M5 — stationary steering regression';
            document.body.appendChild(label);
          });

          const setLabel = async (text) => {
            await page.evaluate((t) => {
              const el = document.getElementById('recording-test-label');
              if (el) el.textContent = t;
            }, text);
          };

          await setLabel('FULL LEFT — 0 mph, no shake, no smoke');
          await page.keyboard.down('ArrowLeft');
          await page.waitForTimeout(3500);
          await page.keyboard.up('ArrowLeft');

          await setLabel('CENTER — checking residual movement');
          await page.waitForTimeout(1800);

          await setLabel('FULL RIGHT — 0 mph, no shake, no smoke');
          await page.keyboard.down('ArrowRight');
          await page.waitForTimeout(3500);
          await page.keyboard.up('ArrowRight');

          await setLabel('CENTER — test complete');
          await page.waitForTimeout(1800);

          const video = page.video();
          if (!video) throw new Error('Playwright did not create a video');
          await context.close();
          const rawPath = await video.path();
          await copyFile(rawPath, 'artifacts/stationary-steering-test.webm');
          await browser.close();
          console.log('Video captured:', rawPath);
          JS

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: stationary-steering-test-video
          path: artifacts/stationary-steering-test.webm
          if-no-files-found: error
          retention-days: 7
