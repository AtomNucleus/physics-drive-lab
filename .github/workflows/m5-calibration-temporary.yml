name: Temporary 2025 M5 Calibration

on:
  push:
    branches:
      - agent/dynamic-tire-load-transfer

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/dynamic-tire-load-transfer
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install dependencies
        run: npm install

      - name: Apply M5 control calibration
        run: |
          python3 scripts/m5_finalize_patch.py
          python3 scripts/m5_sensor_patch.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/physics/Vehicle.ts src/physics/Powertrain.ts src/physics/DriverAids.ts src/physics/m5G90.ts
            git commit -m "Use wheel-speed slip for M5 ABS and traction control"
            git push origin HEAD:agent/dynamic-tire-load-transfer
          fi

      - name: Production build
        run: npm run build

      - name: Run M5 dynamics benchmark
        run: npx tsx scripts/m5_bench.ts | tee m5-calibration.log

      - name: Run launch diagnostic
        run: npx tsx scripts/m5_launch_diag.ts | tee m5-launch-diag.log

      - name: Upload calibration results
        uses: actions/upload-artifact@v4
        with:
          name: m5-calibration
          path: |
            m5-calibration.json
            m5-calibration.log
            m5-launch-diag.log
          retention-days: 1
