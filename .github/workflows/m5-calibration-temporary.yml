name: Temporary 2025 M5 Calibration

on:
  push:
    branches:
      - agent/dynamic-tire-load-transfer

concurrency:
  group: m5-calibration
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/dynamic-tire-load-transfer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install dependencies
        run: npm install

      - name: Apply configurable TCS for calibration
        run: python3 scripts/m5_tcs_patch.py

      - name: Production build
        run: npm run build

      - name: Run M5 dynamics benchmark
        run: npx tsx scripts/m5_bench.ts | tee m5-calibration.log

      - name: Run launch diagnostic
        run: npx tsx scripts/m5_launch_diag.ts | tee m5-launch-diag.log

      - name: Run M5 parameter sweep
        run: npx tsx scripts/m5_parameter_sweep.ts | tee m5-parameter-sweep.log

      - name: Run brake torque diagnostic
        run: npx tsx scripts/m5_brake_diag.ts | tee m5-brake-diag.log

      - name: Run drag/brake diagnostic
        run: npx tsx scripts/m5_drag_brake_diag.ts | tee m5-drag-brake-diag.log

      - name: Run speed-controlled skidpad
        run: npx tsx scripts/m5_skidpad_speed_control.ts | tee m5-skidpad-speed-control.log

      - name: Upload calibration results
        uses: actions/upload-artifact@v4
        with:
          name: m5-calibration
          path: |
            m5-calibration.json
            m5-calibration.log
            m5-launch-diag.log
            m5-parameter-sweep.log
            m5-brake-diag.log
            m5-drag-brake-diag.log
            m5-skidpad-speed-control.log
          retention-days: 1
