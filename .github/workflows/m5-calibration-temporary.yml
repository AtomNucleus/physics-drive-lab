name: Temporary 2025 M5 Calibration

on:
  push:
    branches:
      - agent/dynamic-tire-load-transfer

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/dynamic-tire-load-transfer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Run M5 dynamics benchmark
        run: npx tsx scripts/m5_bench.ts | tee m5-calibration.log

      - name: Upload calibration results
        uses: actions/upload-artifact@v4
        with:
          name: m5-calibration
          path: |
            m5-calibration.json
            m5-calibration.log
          retention-days: 1
