name: Temporary 2025 M5 Calibration

on:
  push:
    branches:
      - agent/dynamic-tire-load-transfer

concurrency:
  group: m5-calibration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/dynamic-tire-load-transfer
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install dependencies
        run: npm install

      - name: Lock final calibrated values
        run: |
          git pull --rebase origin agent/dynamic-tire-load-transfer
          python3 scripts/m5_lock_calibration.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/physics/m5G90.ts src/physics/Vehicle.ts
            git commit -m "Lock 2025 BMW M5 instrumented calibration"
            git pull --rebase origin agent/dynamic-tire-load-transfer
            git push origin HEAD:agent/dynamic-tire-load-transfer
          fi

      - name: Production build
        run: npm run build

      - name: Run final M5 benchmark
        run: npx tsx scripts/m5_bench.ts | tee m5-calibration.log

      - name: Run speed-controlled skidpad
        run: npx tsx scripts/m5_skidpad_speed_control.ts | tee m5-skidpad-speed-control.log

      - name: Upload final calibration results
        uses: actions/upload-artifact@v4
        with:
          name: m5-calibration-final
          path: |
            m5-calibration.json
            m5-calibration.log
            m5-skidpad-speed-control.log
          retention-days: 1
