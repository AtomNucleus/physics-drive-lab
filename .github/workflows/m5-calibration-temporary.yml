name: Finalize M5 Calibration

on:
  push:
    branches:
      - agent/dynamic-tire-load-transfer

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/dynamic-tire-load-transfer
          fetch-depth: 0

      - name: Lock production calibration and remove harness
        run: |
          git pull --rebase origin agent/dynamic-tire-load-transfer
          python3 scripts/m5_lock_calibration.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/m5G90.ts src/physics/Vehicle.ts
          git rm -f scripts/m5_* .github/workflows/m5-calibration-temporary.yml
          git commit -m "Finalize 2025 BMW M5 instrumented calibration"
          git push origin HEAD:agent/dynamic-tire-load-transfer
