name: Temporary 2025 M5 Calibration

on:
  push:
    branches:
      - agent/dynamic-tire-load-transfer

concurrency:
  group: m5-calibration
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/dynamic-tire-load-transfer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Run precision brake force and bias sweep
        run: npx tsx scripts/m5_brake_precision_sweep.ts | tee m5-brake-precision.log

      - name: Run focused launch fill sweep
        run: npx tsx scripts/m5_launch_fill_sweep.ts | tee m5-launch-fill-sweep.log

      - name: Upload calibration results
        uses: actions/upload-artifact@v4
        with:
          name: m5-final-precision
          path: |
            m5-brake-precision.log
            m5-launch-fill-sweep.log
          retention-days: 1
