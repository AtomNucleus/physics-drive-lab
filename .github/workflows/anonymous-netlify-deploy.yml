name: Anonymous Netlify Deploy
# deploy exact main 10a77a2d after PR14 merge

on:
  push:
    branches:
      - deploy/auto-transmission-netlify
    paths:
      - .github/workflows/anonymous-netlify-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Deploy anonymously to Netlify
        run: npx --yes netlify-cli@latest deploy --allow-anonymous --dir=dist --json
