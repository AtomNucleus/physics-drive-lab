name: Deploy primary experience to Netlify

on:
  push:
    branches:
      - main
      - agent/full-tire-combined-slip
      - agent/m5-unsprung-bump-validation
    paths:
      - ".github/workflows/anonymous-netlify-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production app
        run: npm run build
      - name: Deploy anonymously to Netlify
        run: npx --yes netlify-cli deploy --prod --dir dist --json
