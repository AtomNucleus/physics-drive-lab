name: Full Quality M5 Asset Probe

on:
  push:
    branches:
      - codex/full-quality-m5
    paths:
      - .github/workflows/anonymous-netlify-deploy.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/full-quality-m5
      - name: Probe public source for the previously supplied BMW M5 G90 package
        shell: bash
        run: |
          set -euo pipefail
          URL='https://dlcfun.com/en/assetto-corsa/bmw-m5-g90-mod'
          curl --fail --location --silent --show-error \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36' \
            "$URL" -o /tmp/m5-page.html
          mkdir -p artifacts
          python - <<'PY' | tee artifacts/full-quality-m5-source-probe.txt
          import html
          import re
          from pathlib import Path

          text = Path('/tmp/m5-page.html').read_text(errors='replace')
          decoded = html.unescape(text).replace('\\u0026', '&').replace('\\/', '/')
          print(f'PAGE_BYTES={len(text.encode())}')

          patterns = [
              'bmw-m5-g90-2.zip',
              'bmw_m5_2024',
              '89.42',
              'storage.dlcfun.com',
              'downloadurl',
              'download_url',
              'fileurl',
              'file_url',
          ]
          lower = decoded.lower()
          for needle in patterns:
              print(f'\nCONTEXT {needle}')
              start = 0
              hits = 0
              while hits < 8:
                  idx = lower.find(needle.lower(), start)
                  if idx < 0:
                      break
                  lo = max(0, idx - 700)
                  hi = min(len(decoded), idx + len(needle) + 1400)
                  snippet = re.sub(r'\s+', ' ', decoded[lo:hi])
                  print(snippet)
                  start = idx + len(needle)
                  hits += 1

          print('\nSTORAGE_URLS')
          seen = set()
          for candidate in re.findall(r'https?://[^"\'<>\\\s]+', decoded):
              candidate = candidate.rstrip('),.;]')
              if 'storage.dlcfun.com' in candidate and candidate not in seen:
                  seen.add(candidate)
                  print(candidate)
          PY
      - name: Persist probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/full-quality-m5-source-probe.txt
          git commit -m 'Refine full-quality M5 asset source probe'
          git push origin HEAD:codex/full-quality-m5
