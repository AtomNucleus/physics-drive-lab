name: Anonymous Netlify Deploy
# preview: hold-drag orbit camera

on:
  push:
    branches:
      - main
      - agent/full-tire-combined-slip
      - agent/hold-drag-orbit-camera
    paths:
      - .github/workflows/anonymous-netlify-deploy.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/anonymous-netlify-deploy.yml
      - src/graphics/cameraController.ts

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Deploy anonymously to Netlify
        id: netlify
        env:
          CI: true
        run: |
          npx --yes netlify-cli@latest deploy --allow-anonymous --dir=dist --json > netlify-deploy.json
          cat netlify-deploy.json
          DEPLOY_URL=$(node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('netlify-deploy.json','utf8')); process.stdout.write(j.deploy_ssl_url || j.deploy_url || j.url || '')")
          test -n "$DEPLOY_URL"
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
      - name: Post preview URL to PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ steps.netlify.outputs.deploy_url }}
        run: gh pr comment 31 --body "Orbit camera test build: $DEPLOY_URL"
