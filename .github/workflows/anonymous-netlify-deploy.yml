name: Anonymous Netlify Deploy
# preview: PR #33 BMW window-gap visual fix

on:
  push:
    branches:
      - main
      - agent/full-tire-combined-slip
      - agent/fix-bmw-window-gap
    paths:
      - .github/workflows/anonymous-netlify-deploy.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Deploy anonymously to Netlify
        run: |
          npx --yes netlify-cli@latest deploy --allow-anonymous --dir=dist --json | tee .netlify-preview-output.json
      - name: Publish preview result to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .netlify-preview-output.json
          git commit -m "Record temporary Netlify preview URL" || exit 0
          git push
