name: Anonymous Netlify Deploy
# preview: latest M5 physical oversteer recovery

on:
  push:
    branches:
      - main
      - agent/m5-transient-behavior
    paths:
      - .github/workflows/anonymous-netlify-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Deploy anonymously to Netlify
        run: npx --yes netlify-cli@latest deploy --allow-anonymous --dir=dist --json
