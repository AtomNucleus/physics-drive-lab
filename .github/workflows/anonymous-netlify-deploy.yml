name: Anonymous Netlify Deploy
# PR #30 anonymous preview reporter

on:
  push:
    branches:
      - main
      - agent/low-speed-brake-limit-cycle
    paths:
      - .github/workflows/anonymous-netlify-deploy.yml

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Deploy anonymously to Netlify and report URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          npx --yes netlify-cli@latest deploy --allow-anonymous --dir=dist --json > /tmp/netlify.json
          site_url="$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/netlify.json','utf8')); process.stdout.write(d.site_url || d.deploy_url || '')")"
          test -n "$site_url"
          gh pr comment 30 --repo "$GITHUB_REPOSITORY" --body "Netlify preview for PR #30: $site_url"
