name: Anonymous Netlify Deploy
# temporary self-reporting M5 oversteer diagnostic

on:
  push:
    branches:
      - main
      - agent/m5-transient-behavior
    paths:
      - .github/workflows/anonymous-netlify-deploy.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run and publish M5 recovery diagnostic
        shell: bash
        run: |
          set +e
          npm run test:m5-oversteer > .ci-m5-oversteer-result.txt 2>&1
          status=$?
          printf '\n__EXIT_STATUS__=%s\n' "$status" >> .ci-m5-oversteer-result.txt
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-m5-oversteer-result.txt
          git commit -m "Record M5 recovery diagnostic result"
          git push origin HEAD:agent/m5-transient-behavior
