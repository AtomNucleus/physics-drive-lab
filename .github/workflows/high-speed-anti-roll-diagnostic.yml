name: High-speed anti-roll diagnostic

on:
  push:
    branches:
      - agent/anti-roll-bars
    paths:
      - .github/workflows/high-speed-anti-roll-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:high-speed
