name: Apply unsprung force routing

on:
  push:
    branches:
      - agent/unsprung-mass-dynamics

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Route tire and chassis vertical loads separately') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route contact-patch and chassis forces separately
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/physics/Vehicle.ts')
          text = path.read_text()
          replacements = [
              (
                  "        suspState.forceNorm,\n        suspState.dynamicCamberDeg,",
                  "        suspState.tireNormalForceN,\n        suspState.dynamicCamberDeg,"
              ),
              (
                  "      if (!suspState.isAirborne && suspState.forceNorm > 0) {",
                  "      if (!suspState.isAirborne && suspState.tireNormalForceN > 0) {"
              ),
              (
                  "        const fyBody = suspState.forceNorm; // Normal upward reaction from suspension",
                  "        const fyBody = suspState.chassisForceN; // Delayed spring/damper reaction transmitted into the sprung chassis"
              ),
              (
                  "        suspensionForce: susp.forceNorm,",
                  "        suspensionForce: susp.tireNormalForceN,"
              ),
              (
                  "        forceVectorNorm: susp.forceNorm,",
                  "        forceVectorNorm: susp.tireNormalForceN,"
              ),
          ]
          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f'Expected Vehicle.ts pattern not found: {old!r}')
          if changed:
              path.write_text(text)
          PY
      - name: Commit force-routing correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/Vehicle.ts
          git commit -m "Route tire and chassis vertical loads separately"
          git push
