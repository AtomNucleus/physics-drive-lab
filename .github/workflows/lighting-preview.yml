name: Lighting Preview

on:
  push:
    branches:
      - agent/brighten-car-lighting

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply lighting change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/graphics/environment.ts')
          s = p.read_text()
          old = 'new THREE.HemisphereLight(0xe0f2fe, 0x1e293b, 0.75)'
          new = 'new THREE.HemisphereLight(0xe0f2fe, 0x1e293b, 1.1)'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('Expected HemisphereLight setting not found')
          PY

      - name: Remove temporary workflow from branch
        run: rm .github/workflows/lighting-preview.yml

      - name: Commit lighting change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/graphics/environment.ts .github/workflows/lighting-preview.yml
          git commit -m "Brighten car fill lighting"
          git push origin HEAD:agent/brighten-car-lighting

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy anonymous Netlify preview
        shell: bash
        run: |
          npx --yes netlify-cli@latest deploy --allow-anonymous --dir dist --no-build 2>&1 | tee netlify-deploy.log

      - name: Upload deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netlify-deploy-log
          path: netlify-deploy.log
          if-no-files-found: ignore
