name: Temporary Vehicle Realism Bench

on:
  push:
    branches:
      - agent/dynamic-tire-load-transfer

jobs:
  realism:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install dependencies
        run: npm install

      - name: Run vehicle-dynamics realism bench
        run: |
          cat > /tmp/realism-bench.ts <<'TS'
          import fs from 'node:fs';
          import { Simulation } from '${{ github.workspace }}/src/physics/Simulation.ts';
          import { TireModel } from '${{ github.workspace }}/src/physics/TireModel.ts';
          import { DEFAULT_VEHICLE_CONFIG } from '${{ github.workspace }}/src/physics/vehiclePresets.ts';
          import type { VehicleConfig, ControlInputs } from '${{ github.workspace }}/src/types.ts';

          const G = 9.81;
          const DT = 1 / 120;
          const zero: ControlInputs = { throttle: 0, brake: 0, steer: 0, handbrake: false, shiftUp: false, shiftDown: false };
          const avg = (xs: number[]) => xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : 0;
          const absAvg = (xs: number[]) => avg(xs.map(Math.abs));
          const deg = (r: number) => r * 180 / Math.PI;
          const firstTime = (rows: any[], predicate: (r:any)=>boolean) => rows.find(predicate)?.t ?? null;
          const tail = <T,>(xs: T[], n: number) => xs.slice(Math.max(0, xs.length - n));

          function setupAtSpeed(config: VehicleConfig, speedMs: number, correctedInertia = false) {
            const sim = new Simulation(config);
            sim.reset(0, 0, 0);
            if (correctedInertia) {
              // Coordinate system is x=lateral/pitch axis, y=vertical/yaw axis, z=longitudinal/roll axis.
              sim.vehicle.rigidBody.config.inertia.x = config.chassisPitchInertia;
              sim.vehicle.rigidBody.config.inertia.z = config.chassisRollInertia;
            }
            sim.vehicle.rigidBody.velocity = { x: 0, y: 0, z: speedMs };
            sim.vehicle.wheels.forEach(w => w.reset(speedMs));
            sim.vehicle.powertrain.gear = 0;
            // Let vertical suspension settle without significantly changing forward speed.
            for (let i=0;i<60;i++) sim.stepExplicit(zero,1);
            return sim;
          }

          function axleLoads(sim: Simulation) {
            const w = sim.vehicle.getState().wheels;
            return {
              front: w[0].suspensionForce + w[1].suspensionForce,
              rear: w[2].suspensionForce + w[3].suspensionForce,
              left: w[0].suspensionForce + w[2].suspensionForce,
              right: w[1].suspensionForce + w[3].suspensionForce,
              fl: w[0].suspensionForce, fr: w[1].suspensionForce,
              rl: w[2].suspensionForce, rr: w[3].suspensionForce,
            };
          }

          function steerStep(config: VehicleConfig, correctedInertia=false) {
            const sim = setupAtSpeed(config, 100/3.6, correctedInertia);
            const baseline = axleLoads(sim);
            const rows:any[] = [];
            for (let i=0;i<144;i++) {
              const s = sim.stepExplicit({ ...zero, steer: 0.22 },1);
              const loads = axleLoads(sim);
              const e = sim.vehicle.rigidBody.getEuler();
              const latForce = s.wheels.reduce((sum,w)=>sum+w.forceVectorLat,0);
              rows.push({
                t:(i+1)*DT,
                yawRate:s.yawRate,
                roll:e.roll,
                pitch:e.pitch,
                latG:sim.vehicle.rigidBody.acceleration.x/G,
                latForce,
                left:loads.left,right:loads.right,
                front:loads.front,rear:loads.rear,
                fl:loads.fl,fr:loads.fr,rl:loads.rl,rr:loads.rr,
              });
            }
            const steady = tail(rows,24);
            const peakFy = Math.max(...rows.map(r=>Math.abs(r.latForce)));
            const peakYaw = Math.max(...rows.map(r=>Math.abs(r.yawRate)));
            const peakRoll = Math.max(...rows.map(r=>Math.abs(r.roll)));
            const steadyLatG = absAvg(steady.map(r=>r.latG));
            const steadyRoll = absAvg(steady.map(r=>r.roll));
            const steadySideDiff = absAvg(steady.map(r=>r.left-r.right));
            const measuredTransfer = steadySideDiff/2;
            const expectedTransfer = config.mass * steadyLatG * G * config.centerOfGravityHeight / config.trackWidth;
            return {
              correctedInertia,
              baseline,
              peakYawRateDegS:deg(peakYaw),
              steadyLatG,
              steadyRollDeg:deg(steadyRoll),
              rollGradientDegPerG: steadyLatG>0.05 ? deg(steadyRoll)/steadyLatG : null,
              tireForce10PctSec:firstTime(rows,r=>Math.abs(r.latForce)>=peakFy*0.10),
              tireForce50PctSec:firstTime(rows,r=>Math.abs(r.latForce)>=peakFy*0.50),
              yaw10PctSec:firstTime(rows,r=>Math.abs(r.yawRate)>=peakYaw*0.10),
              yaw50PctSec:firstTime(rows,r=>Math.abs(r.yawRate)>=peakYaw*0.50),
              roll10PctSec:firstTime(rows,r=>Math.abs(r.roll)>=peakRoll*0.10),
              roll50PctSec:firstTime(rows,r=>Math.abs(r.roll)>=peakRoll*0.50),
              measuredLateralTransferN:measuredTransfer,
              expectedLateralTransferN:expectedTransfer,
              lateralTransferRatio:expectedTransfer>1?measuredTransfer/expectedTransfer:null,
              minimumWheelLoadN:Math.min(...rows.flatMap(r=>[r.fl,r.fr,r.rl,r.rr])),
            };
          }

          function braking(config: VehicleConfig, correctedInertia=false) {
            const sim = setupAtSpeed(config, 100/3.6, correctedInertia);
            const baseline = axleLoads(sim);
            const rows:any[] = [];
            for (let i=0;i<96;i++) {
              const s = sim.stepExplicit({ ...zero, brake: 0.72 },1);
              const loads = axleLoads(sim);
              const e = sim.vehicle.rigidBody.getEuler();
              const longG = sim.vehicle.rigidBody.acceleration.z/G;
              rows.push({t:(i+1)*DT,longG,pitch:e.pitch,front:loads.front,rear:loads.rear,speed:s.speedMs});
            }
            const useful = rows.filter(r=>r.speed>8);
            const peakDecelG = Math.max(...useful.map(r=>Math.abs(r.longG)));
            const peakFrontGain = Math.max(...useful.map(r=>r.front-baseline.front));
            const peakPitch = Math.max(...useful.map(r=>Math.abs(r.pitch)));
            // Compare measured peak load transfer to quasi-static transfer at the decel around that region.
            const expectedAtPeak = config.mass * peakDecelG * G * config.centerOfGravityHeight / config.wheelbase;
            return {
              correctedInertia,
              baseline,
              peakDecelG,
              peakPitchDeg:deg(peakPitch),
              pitchGradientDegPerG:peakDecelG>0.05?deg(peakPitch)/peakDecelG:null,
              peakFrontLoadGainN:peakFrontGain,
              expectedLongitudinalTransferN:expectedAtPeak,
              longitudinalTransferRatio:expectedAtPeak>1?peakFrontGain/expectedAtPeak:null,
              frontTransfer50PctSec:firstTime(useful,r=>(r.front-baseline.front)>=peakFrontGain*0.5),
              pitch50PctSec:firstTime(useful,r=>Math.abs(r.pitch)>=peakPitch*0.5),
            };
          }

          function reversal(config: VehicleConfig, correctedInertia=false) {
            const sim = setupAtSpeed(config, 80/3.6, correctedInertia);
            // Establish first direction.
            for (let i=0;i<72;i++) sim.stepExplicit({ ...zero, steer: 0.20 },1);
            const yawBefore = sim.vehicle.getState().yawRate;
            const rows:any[]=[];
            for (let i=0;i<120;i++) {
              const s=sim.stepExplicit({ ...zero, steer: -0.20 },1);
              const e=sim.vehicle.rigidBody.getEuler();
              const latForce=s.wheels.reduce((sum,w)=>sum+w.forceVectorLat,0);
              rows.push({t:(i+1)*DT,yaw:s.yawRate,roll:e.roll,latForce});
            }
            const initialForceSign = Math.sign(rows[0]?.latForce || 1);
            const initialYawSign = Math.sign(yawBefore || 1);
            return {
              correctedInertia,
              yawBeforeDegS:deg(yawBefore),
              tireForceReversalSec:firstTime(rows,r=>Math.sign(r.latForce)!==0 && Math.sign(r.latForce)!==initialForceSign),
              yawRateReversalSec:firstTime(rows,r=>Math.sign(r.yaw)!==0 && Math.sign(r.yaw)!==initialYawSign),
              maxOppositeYawDegS:deg(Math.max(...rows.map(r=>Math.abs(r.yaw)))),
              rollZeroCrossSec:firstTime(rows,r=>Math.sign(r.roll)!==Math.sign(rows[0].roll) && Math.abs(r.roll)>0.0005),
            };
          }

          function tireLoadSensitivity(config: VehicleConfig) {
            const staticFront = config.mass*G*config.weightDistributionFront/2;
            const model = new TireModel({
              baseGrip: config.tireGripFront,
              stiffnessB: config.tireStiffness,
              loadSensitivity: config.tireLoadSensitivity,
              slideFrictionMultiplier: config.slideFrictionMultiplier,
              relaxationLength: config.relaxationLength,
              pneumaticTrailMax: config.tirePneumaticTrailMax,
              camberStiffness: 85,
              optimalTemp: config.optimalTireTemp,
              basePressurePsi: config.tireBasePressure,
              referenceLoadN: staticFront,
            });
            const one = model.calculate({ slipRatio:0, slipAngle:0.10, verticalLoad:3000, camberDeg:0, surfaceFriction:1 });
            const two = model.calculate({ slipRatio:0, slipAngle:0.10, verticalLoad:6000, camberDeg:0, surfaceFriction:1 });
            return {
              fy3kN:one.fy,fy6kN:two.fy,forceRatio:Math.abs(two.fy/one.fy),
              mu3kN:one.effectiveMu,mu6kN:two.effectiveMu,muRatio:two.effectiveMu/one.effectiveMu,
            };
          }

          const cfg = { ...DEFAULT_VEHICLE_CONFIG };
          const currentInertia = (()=>{
            const m=cfg.mass,L=cfg.wheelbase,W=cfg.trackWidth,H=cfg.centerOfGravityHeight;
            return {
              x:(m/12)*(W*W+H*H)*1.6,
              y:(m/12)*(L*L+W*W)*1.1,
              z:(m/12)*(L*L+H*H)*1.5,
            };
          })();
          const intendedInertia = { x:cfg.chassisPitchInertia, z:cfg.chassisRollInertia };

          const result = {
            config:{mass:cfg.mass,cgHeight:cfg.centerOfGravityHeight,wheelbase:cfg.wheelbase,track:cfg.trackWidth,relaxationLength:cfg.relaxationLength},
            inertia:{current:currentInertia,intendedConfig:intendedInertia},
            tireLoadSensitivity:tireLoadSensitivity(cfg),
            current:{steer100:steerStep(cfg,false),brake100:braking(cfg,false),reversal80:reversal(cfg,false)},
            correctedAxes:{steer100:steerStep(cfg,true),brake100:braking(cfg,true),reversal80:reversal(cfg,true)},
          };

          fs.writeFileSync('realism-bench.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          TS
          npx tsx /tmp/realism-bench.ts | tee realism-bench.log

      - name: Upload realism data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-realism-bench
          path: |
            realism-bench.json
            realism-bench.log
          if-no-files-found: ignore
          retention-days: 1
