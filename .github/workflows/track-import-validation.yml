name: Track Import Validation

on:
  pull_request:
    paths:
      - 'src/tracks/**'
      - 'tools/ac-import/**'
      - 'src/physics/SurfaceProvider.ts'
      - 'src/physics/vehiclePhysics.ts'
      - 'package.json'
      - '.github/workflows/track-import-validation.yml'
  push:
    branches:
      - 'agent/ac-track-import-pipeline'
    paths:
      - 'src/tracks/**'
      - 'tools/ac-import/**'
      - 'src/physics/SurfaceProvider.ts'
      - 'src/physics/vehiclePhysics.ts'
      - 'package.json'
      - '.github/workflows/track-import-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run test:suspension
      - run: npm run test:corner-load
      - run: npm run test:track
