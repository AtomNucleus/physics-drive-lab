name: Persist validated tire smoke fix

on:
  push:
    branches:
      - agent/full-tire-combined-slip

permissions:
  contents: write

jobs:
  persist-fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix tire smoke detection') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-tire-combined-slip
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Patch gross-slide smoke detection
        shell: python
        run: |
          from pathlib import Path
          import json

          wheel_path = Path('src/physics/WheelDynamics.ts')
          text = wheel_path.read_text()
          helper_marker = "export interface WheelDynamicsConfig {"
          helper = r'''export interface GrossTireSlideEstimate {
            longitudinalSlipSpeed: number;
            lateralSlipSpeed: number;
            totalSlipSpeed: number;
          }

          /**
           * Estimate only the portion of contact-patch motion that represents gross
           * sliding across the road. Normal force-generating tire slip is mostly
           * carcass/contact-patch deformation and must not automatically create smoke.
           */
          export function estimateGrossTireSlide(
            longitudinalVelocity: number,
            lateralVelocity: number,
            wheelSurfaceSpeed: number
          ): GrossTireSlideEstimate {
            const rollingSpeed = Math.max(Math.abs(longitudinalVelocity), Math.abs(wheelSurfaceSpeed));
            const longitudinalPatchSpeed = Math.abs(wheelSurfaceSpeed - longitudinalVelocity);
            const longitudinalAdhesionSpeed = Math.max(0.8, rollingSpeed * 0.15);
            const longitudinalSlipSpeed = Math.max(0, longitudinalPatchSpeed - longitudinalAdhesionSpeed);
            const lateralAdhesionSpeed = Math.max(
              0.45,
              Math.tan(0.16) * Math.max(0.5, Math.abs(longitudinalVelocity))
            );
            const lateralSlipSpeed = Math.max(0, Math.abs(lateralVelocity) - lateralAdhesionSpeed);
            return {
              longitudinalSlipSpeed,
              lateralSlipSpeed,
              totalSlipSpeed: Math.hypot(longitudinalSlipSpeed, lateralSlipSpeed),
            };
          }

          '''
          if 'estimateGrossTireSlide' not in text:
              text = text.replace(helper_marker, helper + helper_marker, 1)

          old = r'''    const skidSpeedGate = PhysicsMath.clamp((patchSlipSpeed - 0.45) / 1.75, 0, 1);
              const skidPowerGate = PhysicsMath.clamp((slipEnergy - 600) / 6000, 0, 1);
              const dissipativeSkidGate = Math.min(skidSpeedGate, skidPowerGate);
              const isDissipativeSkid =
                dissipativeSkidGate > 0 &&
                (target.isSkidding || gripUtilization > 0.99 || patchSlipSpeed > 1.2);
              const skidIntensity = isDissipativeSkid
                ? PhysicsMath.clamp(
                    Math.max(target.skidIntensity * dynamicBlend, gripUtilization - 0.82, dissipativeSkidGate) *
                      dissipativeSkidGate,
                    0,
                    1
                  )
                : 0;'''

          new = r'''    // Visible smoke/skid marks require gross road sliding, not ordinary
              // force-generating slip near the tire's cornering peak.
              const grossSlide = estimateGrossTireSlide(
                longitudinalVelocity,
                lateralVelocity,
                wheelSurfaceSpeed
              );
              const grossSlipEnergy =
                Math.abs(contactFxForWheelTorque) * grossSlide.longitudinalSlipSpeed +
                Math.abs(fy) * grossSlide.lateralSlipSpeed;
              const skidSpeedGate = PhysicsMath.clamp((grossSlide.totalSlipSpeed - 0.35) / 2.4, 0, 1);
              const skidPowerGate = PhysicsMath.clamp((grossSlipEnergy - 1200) / 9000, 0, 1);
              const dissipativeSkidGate = Math.min(skidSpeedGate, skidPowerGate);
              const isDissipativeSkid = dissipativeSkidGate > 0;
              const skidIntensity = isDissipativeSkid
                ? PhysicsMath.clamp(
                    Math.max(dissipativeSkidGate, target.skidIntensity * 0.35 * dynamicBlend) *
                      dissipativeSkidGate,
                    0,
                    1
                  )
                : 0;'''

          if old not in text:
              raise SystemExit('Existing skid block not found')
          wheel_path.write_text(text.replace(old, new, 1))

          Path('src/physics/tests/TireSmokeRegressionTests.ts').write_text(r'''import { estimateGrossTireSlide } from '../WheelDynamics';

          const assert = (condition: boolean, message: string) => {
            if (!condition) throw new Error(message);
          };
          const deg = (value: number) => value * Math.PI / 180;
          const cornerSpeed = 25;
          const normalCorner = estimateGrossTireSlide(cornerSpeed, Math.tan(deg(7.7)) * cornerSpeed, cornerSpeed);
          assert(normalCorner.totalSlipSpeed < 1e-9, 'normal peak cornering must not trigger smoke');
          const drift = estimateGrossTireSlide(cornerSpeed, Math.tan(deg(18)) * cornerSpeed, cornerSpeed);
          assert(drift.lateralSlipSpeed > 2.5, '18 degree drift should register gross lateral slide');
          const traction = estimateGrossTireSlide(30, 0, 33.6);
          assert(traction.longitudinalSlipSpeed < 1e-9, 'peak traction must not count as burnout slide');
          const burnout = estimateGrossTireSlide(5, 0, 15);
          assert(burnout.longitudinalSlipSpeed > 5, 'wheelspin should register gross longitudinal slide');
          const locked = estimateGrossTireSlide(20, 0, 0);
          assert(locked.longitudinalSlipSpeed > 10, 'locked wheel should register gross longitudinal slide');
          console.log('Tire smoke regression checks passed.');
          ''')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package.setdefault('scripts', {})['test:smoke'] = 'tsx src/physics/tests/TireSmokeRegressionTests.ts'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

      - name: Regression checks
        run: |
          npm run test:tire
          npm run test:smoke
          npm run test:stationary
          npm run test:corner-load
          npm run build

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/WheelDynamics.ts src/physics/tests/TireSmokeRegressionTests.ts package.json
          git commit -m "fix tire smoke detection"
          git push origin HEAD:agent/full-tire-combined-slip
