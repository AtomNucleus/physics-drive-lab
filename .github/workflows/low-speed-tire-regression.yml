name: Low-speed tire regression

on:
  push:
    branches:
      - agent/fix-stationary-steering-shake
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply road-normal suspension force fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/physics/Vehicle.ts')
          text = path.read_text()
          old = "\n".join([
              "      if (!suspState.isAirborne && suspState.tireNormalForceN > 0) {",
              "        // Convert tire planar forces (Fx along wheel heading, Fy lateral to wheel) back into body frame",
              "        const fxBody = tireOut.fy * cosS + tireOut.fx * sinS;",
              "        const fzBody = -tireOut.fy * sinS + tireOut.fx * cosS;",
              "        const fyBody = suspState.chassisForceN; // Delayed spring/damper reaction transmitted into the sprung chassis",
              "",
              "        const forceBody = PhysicsMath.vec3(fxBody, fyBody, fzBody);",
              "        this.rigidBody.addBodyForceAtPoint(forceBody, contactPointBody);",
              "",
              "        // Apply self-aligning torque Mz to chassis",
              "        this.rigidBody.addBodyTorque(PhysicsMath.vec3(0, tireOut.aligningTorque, 0));",
              "      }",
          ])
          new = "\n".join([
              "      if (!suspState.isAirborne && suspState.tireNormalForceN > 0) {",
              "        // Convert tire planar forces (Fx along wheel heading, Fy lateral to wheel) back into body frame.",
              "        const fxBody = tireOut.fy * cosS + tireOut.fx * sinS;",
              "        const fzBody = -tireOut.fy * sinS + tireOut.fx * cosS;",
              "",
              "        // Tire shear follows the chassis/wheel heading, but suspension support is",
              "        // an external ground-normal reaction. Rotating support with chassis pitch/roll",
              "        // can invent propulsion on a flat road; apply it along the actual road normal.",
              "        const tirePlanarWorld = PhysicsMath.quatRotateVec3(",
              "          this.rigidBody.orientation,",
              "          PhysicsMath.vec3(fxBody, 0, fzBody)",
              "        );",
              "        const suspensionSupportWorld = PhysicsMath.vec3Scale(",
              "          surface.normal,",
              "          suspState.chassisForceN",
              "        );",
              "        const contactForceWorld = PhysicsMath.vec3Add(tirePlanarWorld, suspensionSupportWorld);",
              "        this.rigidBody.addWorldForceAtPoint(contactForceWorld, contactWorld);",
              "",
              "        // Apply self-aligning torque Mz to chassis",
              "        this.rigidBody.addBodyTorque(PhysicsMath.vec3(0, tireOut.aligningTorque, 0));",
              "      }",
          ])

          if old in text:
              path.write_text(text.replace(old, new, 1))
              print('Applied road-normal suspension support fix')
          elif new in text:
              print('Road-normal suspension support fix already present')
          else:
              raise SystemExit('Expected Vehicle.ts contact-force block not found; refusing blind edit')
          PY

          if git diff --quiet -- src/physics/Vehicle.ts; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/Vehicle.ts
          git commit -m "Apply road-normal suspension support forces"
          git push origin HEAD:agent/fix-stationary-steering-shake

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Parked suspension force diagnostics
        run: npx tsx src/physics/tests/SuspensionForceDirectionDiagnostics.ts

      - name: Stationary steering and low-speed tire regression
        run: npm run test:stationary

      - name: Suspension behavior regression
        run: npm run test:suspension

      - name: Dynamic corner-load regression
        run: npm run test:corner-load

      - name: Production build
        run: npm run build

      - name: TypeScript baseline check
        continue-on-error: true
        run: npm run lint
