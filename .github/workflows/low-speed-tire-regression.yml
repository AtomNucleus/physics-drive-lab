name: Apply suspension force path via physics workflow

on:
  pull_request:
    paths:
      - '.github/workflows/low-speed-tire-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply physical suspension force path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/physics/Vehicle.ts')
          text = p.read_text()
          old = '''        // RigidBody.mass is the complete vehicle mass. The external support on it
        // is therefore the road/tire normal reaction, not the internal spring force.
        const suspensionSupportWorld = PhysicsMath.vec3Scale(
          roadNormal,
          suspState.tireNormalForceN * wheelContactAuthority
        );
        const contactForceWorld = PhysicsMath.vec3Add(tirePlanarWorld, suspensionSupportWorld);

        // Apply the complete road reaction at the actual contact patch. RigidBody's
        // origin is the CG, so addWorldForceAtPoint evaluates M = r x F directly
        // around the physical mass center with no artificial yaw/roll/pitch force.
        this.rigidBody.addWorldForceAtPoint(contactForceWorld, contactWorld);
'''
          new = '''        // Tire normal load excites the unsprung wheel/hub and sets available tire grip.
        // The sprung chassis receives the suspension-side reaction instead, closing
        // the physical path: road -> wheel -> spring/damper/ARB -> chassis.
        const suspensionReactionWorld = PhysicsMath.vec3(
          0,
          suspState.chassisForceN * wheelContactAuthority,
          0
        );
        const suspensionHardpointWorld = PhysicsMath.vec3Add(
          this.rigidBody.position,
          PhysicsMath.quatRotateVec3(this.rigidBody.orientation, hpBody)
        );

        // The rigid-body origin is the physical CG. Planar tire shear keeps the
        // actual contact-patch moment arm; vertical suspension force acts at its pickup.
        this.rigidBody.addWorldForceAtPoint(tirePlanarWorld, contactWorld);
        this.rigidBody.addWorldForceAtPoint(suspensionReactionWorld, suspensionHardpointWorld);
'''
          if old not in text:
              raise SystemExit('expected Vehicle.ts force block not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify candidate builds and reproducer runs
        run: |
          npm run test:powered-full-lock
          npm run build

      - name: Commit candidate and restore normal workflows
        run: |
          git checkout HEAD^ -- .github/workflows/low-speed-tire-regression.yml
          git checkout 8a4c8c8400851764a2db8aed79449d433ec16076 -- .github/workflows/build.yml
          rm -f .github/workflows/apply-suspension-force-path-fix.yml .force-path-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/Vehicle.ts .github/workflows/build.yml .github/workflows/low-speed-tire-regression.yml
          git add -u .github/workflows .force-path-result.txt 2>/dev/null || true
          git commit -m "Route suspension reaction into physical CG chassis"
          git push origin HEAD:${{ github.head_ref }}
