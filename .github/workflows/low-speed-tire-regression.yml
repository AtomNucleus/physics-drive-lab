name: Vehicle physics regression

on:
  pull_request:
    paths:
      - 'src/physics/**'
      - 'src/graphics/carRenderer.ts'
      - 'src/App.tsx'
      - 'package.json'
      - 'PHYSICS_CONVENTIONS.md'
      - 'AGENTS.md'
      - '.github/workflows/low-speed-tire-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply PR #30 suspension force-path fix
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 30
        shell: bash
        run: |
          set -e
          branch="agent/low-speed-brake-limit-cycle"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          python - <<'PY'
          from pathlib import Path
          path = Path('src/physics/Vehicle.ts')
          text = path.read_text()
          old = '''        // RigidBody.mass is the complete vehicle mass. The external support on it
        // is therefore the road/tire normal reaction, not the internal spring force.
        const suspensionSupportWorld = PhysicsMath.vec3Scale(
          roadNormal,
          suspState.tireNormalForceN * wheelContactAuthority
        );
        const contactForceWorld = PhysicsMath.vec3Add(tirePlanarWorld, suspensionSupportWorld);

        // Apply the complete road reaction at the actual contact patch. RigidBody's
        // origin is the CG, so addWorldForceAtPoint evaluates M = r x F directly
        // around the physical mass center with no artificial yaw/roll/pitch force.
        this.rigidBody.addWorldForceAtPoint(contactForceWorld, contactWorld);
'''
          new = '''        // Tire normal load excites the unsprung wheel/hub and sets the tire model's
        // available grip. It must not also push the chassis directly or the road
        // bypasses the spring and damper. Feed the rigid body only the signed
        // suspension-side reaction computed from spring + damper + bump stop + ARB
        // + hard-stop forces.
        const suspensionReactionWorld = PhysicsMath.vec3(
          0,
          suspState.chassisForceN * wheelContactAuthority,
          0
        );
        const suspensionHardpointWorld = PhysicsMath.vec3Add(
          this.rigidBody.position,
          PhysicsMath.quatRotateVec3(this.rigidBody.orientation, hpBody)
        );

        // Tire shear acts at the road contact patch around the physical CG. The
        // vertical suspension reaction acts at the chassis pickup, closing the
        // physical loop: road -> wheel -> spring/damper/ARB -> chassis.
        this.rigidBody.addWorldForceAtPoint(tirePlanarWorld, contactWorld);
        this.rigidBody.addWorldForceAtPoint(suspensionReactionWorld, suspensionHardpointWorld);
'''
          if new in text:
              print('Suspension force-path fix already present')
          elif old in text:
              path.write_text(text.replace(old, new, 1))
              print('Patched Vehicle.ts suspension force path')
          else:
              raise SystemExit('Expected Vehicle.ts force-path block not found')
          PY
          if git diff --quiet -- src/physics/Vehicle.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/Vehicle.ts
          git commit -m "Route suspension reaction through chassis"
          git push origin HEAD:"$branch"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Physics coordinate/sign convention guardrails
        run: npm run test:conventions

      - name: Mobile steering regression
        run: npm run test:mobile

      - name: Digital steering shaping regression
        run: npm run test:digital-steering

      - name: Mouse steering sign/range regression
        run: npm run test:mouse-steering

      - name: 50 kmh full-lock turn-radius diagnostic
        run: npm run test:turn-radius

      - name: 6 kmh crawl-speed stability regression
        run: npm run test:crawl

      - name: Low-speed cornering regression
        run: npm run test:cornering

      - name: Stationary steering and low-speed tire regression
        run: npm run test:stationary

      - name: Suspension behavior regression
        run: npm run test:suspension

      - name: Suspension kinematics regression
        run: npm run test:kinematics

      - name: PR18 anti-roll + suspension kinematics integration
        run: npm run test:kinematics-arb

      - name: Steering direction regression
        run: npm run test:steering-direction

      - name: Dynamic corner-load regression
        run: npm run test:corner-load

      - name: Full tire and combined-slip regression
        run: npm run test:tire

      - name: M5 transient response regression
        run: npm run test:m5-transient

      - name: M5 driver-controlled oversteer recovery regression
        run: npm run test:m5-oversteer

      - name: Automatic transmission and low-speed propulsion regression
        run: npm run test:automatic

      - name: Wheel visual pose regression
        run: npm run test:wheel-visual

      - name: M5 drive-mode regression
        run: npm run test:m5-rwd

      - name: High-speed anti-roll handling regression
        run: npm run test:high-speed

      - name: Tire smoke regression
        run: npm run test:smoke

      - name: Spinout and wipeout stability regression
        run: npm run test:crash

      - name: Crash recovery and CG-pivot regression
        run: npm run test:crash-recovery

      - name: Production build
        run: npm run build

      - name: TypeScript baseline check
        continue-on-error: true
        run: npm run lint
