name: Vehicle physics regression

on:
  pull_request:
    paths:
      - 'src/physics/**'
      - 'package.json'
      - '.github/workflows/low-speed-tire-regression.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Stationary steering and low-speed tire regression
        run: npm run test:stationary

      - name: Suspension behavior regression
        run: npm run test:suspension

      - name: Dynamic corner-load regression
        run: npm run test:corner-load

      - name: Production build
        run: npm run build

      # src/types.ts is empty on main today, so the repository-wide typecheck has
      # pre-existing missing-export failures. Keep it visible without blocking this
      # physics regression workflow until that baseline issue is repaired separately.
      - name: TypeScript baseline check
        continue-on-error: true
        run: npm run lint
