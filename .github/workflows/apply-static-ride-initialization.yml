name: Apply static ride initialization

on:
  push:
    branches:
      - agent/unsprung-mass-dynamics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/scripts/apply-static-ride.mjs
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/Vehicle.ts
          git commit -m "Initialize chassis at static suspension equilibrium"
          git push
