name: Apply static ride initialization

on:
  push:
    branches:
      - agent/unsprung-mass-dynamics

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Initialize chassis at static suspension equilibrium') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize rigid body at calculated static ride pose
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/physics/Vehicle.ts')
          text = path.read_text()

          old_import = "import { SuspensionSystem, SuspensionCornerConfig } from './Suspension';"
          new_import = "import { SuspensionSystem, SuspensionCornerConfig, progressiveSpringIncrement, bumpStopForceForDisplacement } from './Suspension';"
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('Suspension import anchor not found')

          old = '''  public reset(x: number = 0, z: number = 0, yaw: number = 0) {
    const H = this.config.centerOfGravityHeight;
    this.rigidBody.position = PhysicsMath.vec3(x, H + 0.35, z);
    this.rigidBody.velocity = PhysicsMath.vec3(0, 0, 0);
    this.rigidBody.angularVelocity = PhysicsMath.vec3(0, 0, 0);
    this.rigidBody.orientation = PhysicsMath.quatFromEuler(0, yaw, 0);
    this.rigidBody.clearForces();
'''
          new = '''  public reset(x: number = 0, z: number = 0, yaw: number = 0) {
    const H = this.config.centerOfGravityHeight;

    // Start at the actual static suspension/tire equilibrium instead of dropping
    // the chassis from an arbitrary ride height. This is especially important once
    // the wheel/hub assemblies carry unsprung inertia: a reset should represent a
    // parked, already-loaded car rather than injecting a fake vertical transient.
    const maxDroop = 0.12;
    const maxBump = 0.14;
    const tireK = Math.max(1000, this.config.tireVerticalStiffness);
    const surfaceY = this.surfaceProvider.sampleSurface(x, z).elevation;

    const staticHardpointY = (targetLoadN: number, springRate: number) => {
      let low = -maxDroop;
      let high = maxBump;
      const preload = maxDroop * 0.78 * Math.max(0, springRate);

      for (let iteration = 0; iteration < 32; iteration++) {
        const displacement = (low + high) * 0.5;
        const springForce = Math.max(
          0,
          preload + progressiveSpringIncrement(displacement, springRate, maxBump, 0.65)
        );
        const bumpStopForce = bumpStopForceForDisplacement(
          displacement,
          maxBump,
          this.config.bumpStopTravelThreshold,
          this.config.bumpStopStiffness
        );
        if (springForce + bumpStopForce < targetLoadN) low = displacement;
        else high = displacement;
      }

      const displacement = (low + high) * 0.5;
      const tireCompression = targetLoadN / tireK;
      const hubY = surfaceY + this.config.wheelRadius - tireCompression;
      return hubY + maxDroop + this.config.suspensionRestLength - displacement;
    };

    const frontTargetLoad =
      this.config.mass * 9.81 * this.config.weightDistributionFront * 0.5;
    const rearTargetLoad =
      this.config.mass * 9.81 * (1 - this.config.weightDistributionFront) * 0.5;
    const frontHardpointY = staticHardpointY(
      frontTargetLoad,
      this.config.suspensionStiffness * 1.05
    );
    const rearHardpointY = staticHardpointY(
      rearTargetLoad,
      this.config.suspensionStiffness * 0.95
    );

    const wheelbase = Math.max(0.001, this.config.wheelbase);
    const frontDist = wheelbase * (1 - this.config.weightDistributionFront);
    const rearDist = wheelbase * this.config.weightDistributionFront;
    const sinStaticPitch = PhysicsMath.clamp(
      (rearHardpointY - frontHardpointY) / wheelbase,
      -0.15,
      0.15
    );
    const staticPitch = Math.asin(sinStaticPitch);
    const bodyYFront = frontHardpointY + frontDist * sinStaticPitch;
    const bodyYRear = rearHardpointY - rearDist * sinStaticPitch;
    const staticBodyY = (bodyYFront + bodyYRear) * 0.5;

    this.rigidBody.position = PhysicsMath.vec3(x, staticBodyY, z);
    this.rigidBody.velocity = PhysicsMath.vec3(0, 0, 0);
    this.rigidBody.angularVelocity = PhysicsMath.vec3(0, 0, 0);
    this.rigidBody.orientation = PhysicsMath.quatFromEuler(staticPitch, yaw, 0);
    this.rigidBody.clearForces();
'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif new not in text:
              raise SystemExit('Vehicle.reset anchor not found')
          PY
      - name: Commit static ride initialization
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/Vehicle.ts
          git commit -m "Initialize chassis at static suspension equilibrium"
          git push
