name: Powered full-lock tire-blend A/B

on:
  pull_request:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Baseline powered full-lock
        run: npm run test:powered-full-lock

      - name: Contact-speed brush handoff at 1.8 m/s
        run: |
          cp src/physics/WheelDynamics.ts /tmp/WheelDynamics.ts
          python - <<'PY'
          from pathlib import Path
          p=Path('src/physics/WheelDynamics.ts')
          s=p.read_text()
          old="""    const wheelSurfaceSpeed = this.angularVelocity * this.radius;
    const rollingSpeed = Math.max(Math.abs(longitudinalVelocity), Math.abs(wheelSurfaceSpeed));
    const dynamicBlendLinear = PhysicsMath.clamp((rollingSpeed - 0.35) / (3.00 - 0.35), 0, 1);
"""
          new="""    const wheelSurfaceSpeed = this.angularVelocity * this.radius;
    const rollingSpeed = Math.max(Math.abs(longitudinalVelocity), Math.abs(wheelSurfaceSpeed));
    // Parking-speed brush authority is a function of the road velocity at the
    // contact patch, not wheel spin. Wheel omega must not feed back into which
    // tire model is active. Above 1.8 m/s planar road speed, use the full dynamic tire.
    const contactRoadSpeed = Math.hypot(longitudinalVelocity, lateralVelocity);
    const dynamicBlendLinear = PhysicsMath.clamp((contactRoadSpeed - 0.35) / (1.80 - 0.35), 0, 1);
"""
          if old not in s: raise SystemExit('blend block not found')
          p.write_text(s.replace(old,new,1))
          PY
          npm run test:powered-full-lock
          cp /tmp/WheelDynamics.ts src/physics/WheelDynamics.ts

      - name: Contact-speed brush handoff at 2.2 m/s
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/physics/WheelDynamics.ts')
          s=p.read_text()
          old="""    const wheelSurfaceSpeed = this.angularVelocity * this.radius;
    const rollingSpeed = Math.max(Math.abs(longitudinalVelocity), Math.abs(wheelSurfaceSpeed));
    const dynamicBlendLinear = PhysicsMath.clamp((rollingSpeed - 0.35) / (3.00 - 0.35), 0, 1);
"""
          new="""    const wheelSurfaceSpeed = this.angularVelocity * this.radius;
    const rollingSpeed = Math.max(Math.abs(longitudinalVelocity), Math.abs(wheelSurfaceSpeed));
    const contactRoadSpeed = Math.hypot(longitudinalVelocity, lateralVelocity);
    const dynamicBlendLinear = PhysicsMath.clamp((contactRoadSpeed - 0.35) / (2.20 - 0.35), 0, 1);
"""
          if old not in s: raise SystemExit('blend block not found')
          p.write_text(s.replace(old,new,1))
          PY
          npm run test:powered-full-lock
          cp /tmp/WheelDynamics.ts src/physics/WheelDynamics.ts

      - name: Contact-speed brush handoff at 2.6 m/s
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/physics/WheelDynamics.ts')
          s=p.read_text()
          old="""    const wheelSurfaceSpeed = this.angularVelocity * this.radius;
    const rollingSpeed = Math.max(Math.abs(longitudinalVelocity), Math.abs(wheelSurfaceSpeed));
    const dynamicBlendLinear = PhysicsMath.clamp((rollingSpeed - 0.35) / (3.00 - 0.35), 0, 1);
"""
          new="""    const wheelSurfaceSpeed = this.angularVelocity * this.radius;
    const rollingSpeed = Math.max(Math.abs(longitudinalVelocity), Math.abs(wheelSurfaceSpeed));
    const contactRoadSpeed = Math.hypot(longitudinalVelocity, lateralVelocity);
    const dynamicBlendLinear = PhysicsMath.clamp((contactRoadSpeed - 0.35) / (2.60 - 0.35), 0, 1);
"""
          if old not in s: raise SystemExit('blend block not found')
          p.write_text(s.replace(old,new,1))
          PY
          npm run test:powered-full-lock
