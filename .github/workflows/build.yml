name: Assetto Corsa importer validation

on:
  push:
    branches:
      - agent/ac-car-importer
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Physics coordinate/sign convention guardrails
        run: npm run test:conventions

      - name: Mobile steering regression
        run: npm run test:mobile

      - name: Digital steering shaping regression
        run: npm run test:digital-steering

      - name: Steering direction regression
        run: npm run test:steering-direction

      - name: Visual scale regression
        run: npm run test:visual-scale

      - name: 6 kmh crawl-speed stability regression
        run: npm run test:crawl

      - name: Low-speed brake ABS/driveline limit-cycle regression
        run: npm run test:low-speed-brake

      - name: Low-speed cornering regression
        run: npm run test:cornering

      - name: Stationary steering regression
        run: npm run test:stationary

      - name: Suspension regression
        run: npm run test:suspension

      - name: Dynamic corner-load regression
        run: npm run test:corner-load

      - name: Tire model regression
        run: npm run test:tire

      - name: M5 transient response regression
        run: npm run test:m5-transient

      - name: M5 chassis inertia and CG dynamics regression
        run: npm run test:m5-chassis

      - name: Generate M5 chassis transient trace graph
        run: npx tsx src/physics/tests/M5ChassisTraceArtifact.ts

      - name: Upload M5 chassis transient trace
        uses: actions/upload-artifact@v4
        with:
          name: m5-chassis-transient-trace
          path: |
            artifacts/m5-chassis-steering-step.csv
            artifacts/m5-chassis-steering-step.svg
          if-no-files-found: error

      - name: M5 quantitative validation suite
        id: m5_validation
        continue-on-error: true
        run: npm run test:m5-validation

      - name: Upload M5 validation report and telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-validation-suite
          path: artifacts/m5-validation/**
          if-no-files-found: error

      - name: M5 driver-controlled oversteer recovery regression
        run: npm run test:m5-oversteer

      - name: M5 xDrive 2WD regression
        run: npm run test:m5-rwd

      - name: Automatic transmission regression
        run: npm run test:automatic

      - name: Production build
        run: npm run build

      - name: Deploy PR #30 anonymously to Netlify
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 30
        id: netlify_preview
        shell: bash
        run: |
          mkdir -p artifacts/netlify-preview
          set +e
          npx --yes netlify-cli@latest deploy --allow-anonymous --dir=dist --json > /tmp/netlify.json 2> /tmp/netlify.err
          status=$?
          set -e
          STATUS="$status" node - <<'NODE'
          const fs = require('fs');
          const status = Number(process.env.STATUS);
          let result;
          if (status === 0) {
            const data = JSON.parse(fs.readFileSync('/tmp/netlify.json', 'utf8'));
            result = {
              status: 'success',
              site_url: data.site_url || data.deploy_url || null,
              deploy_id: data.deploy_id || null,
              password: data.password || null
            };
          } else {
            const stderr = fs.existsSync('/tmp/netlify.err') ? fs.readFileSync('/tmp/netlify.err', 'utf8').slice(-5000) : '';
            result = { status: 'failure', exit_code: status, stderr };
          }
          fs.writeFileSync('artifacts/netlify-preview/result.json', JSON.stringify(result, null, 2) + '\n');
          NODE
          exit "$status"

      - name: Upload PR #30 Netlify preview result
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number == 30
        uses: actions/upload-artifact@v4
        with:
          name: pr30-netlify-preview
          path: artifacts/netlify-preview/result.json
          if-no-files-found: error

      - name: Enforce M5 validation blocking invariants
        if: always() && steps.m5_validation.outcome == 'failure'
        run: |
          echo "M5 validation suite reported a blocking physics invariant failure."
          echo "Download the m5-validation-suite artifact for the report, telemetry and graphs."
          exit 1
