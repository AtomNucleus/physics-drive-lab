name: Validate flat proving ground

on:
  push:
    branches:
      - fix/flat-proving-ground

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Verify physics surface is flat
        run: |
          npx tsx -e "import { ProvingGroundSurfaceProvider } from './src/physics/SurfaceProvider.ts'; const s=new ProvingGroundSurfaceProvider(); for(let x=-1300;x<=1300;x+=25){for(let z=-1300;z<=1300;z+=25){const p=s.sampleSurface(x,z); if(p.elevation!==0||p.slopePitch!==0||p.slopeRoll!==0||Math.abs(p.normal.x)>1e-12||Math.abs(p.normal.y-1)>1e-12||Math.abs(p.normal.z)>1e-12) throw new Error('Non-flat sample at '+x+','+z);}} console.log('Flat surface grid PASS');"
      - name: Run suspension regression
        run: npm run test:suspension
      - name: Production build
        run: npm run build
