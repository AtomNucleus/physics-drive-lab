name: Finalize import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact project
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .repo-upload/chunk_00 \
            .repo-upload/chunk_01 \
            .repo-upload/chunk_02 \
            .repo-upload/chunk_03 \
            .repo-upload/chunk_04 \
            .repo-upload/chunk_05 \
            .repo-upload/chunk_06 \
            .repo-upload/chunk_07 \
            .repo-upload/fix08a_00 \
            .repo-upload/fix08a_01 \
            .repo-upload/fix08_01 \
            .repo-upload/fix08_02 \
            .repo-upload/fix08_03 \
            .repo-upload/fix09_00 \
            .repo-upload/fix09_01 \
            .repo-upload/fix09_02 \
            .repo-upload/fix09_03 \
            .repo-upload/chunk_10 \
            .repo-upload/chunk_11 \
            .repo-upload/chunk_12 \
            > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/physics-drive-lab.tar.gz
          echo "312b1d97a154bd5f09da95cc68bf2cb9a3bdeafd7c8ce76e60b5cc2db72828b9  /tmp/physics-drive-lab.tar.gz" | sha256sum -c -
          tar -xzf /tmp/physics-drive-lab.tar.gz -C .
          rm -rf .repo-upload
          rm -f .github/workflows/import.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import physics drive lab"
          git push
