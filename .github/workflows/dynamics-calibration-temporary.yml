name: Temporary Dynamics Calibration Bench

on:
  push:
    branches:
      - agent/dynamic-tire-load-transfer

jobs:
  dynamics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install
      - name: Run calibration maneuvers
        run: |
          cat > /tmp/dynamics.ts <<'TS'
          import fs from 'node:fs';
          import { Simulation } from '${{ github.workspace }}/src/physics/Simulation.ts';
          import { DEFAULT_VEHICLE_CONFIG } from '${{ github.workspace }}/src/physics/vehiclePresets.ts';
          import type { ControlInputs } from '${{ github.workspace }}/src/types.ts';

          const DT=1/120, G=9.81;
          const zero:ControlInputs={throttle:0,brake:0,steer:0,handbrake:false,shiftUp:false,shiftDown:false};
          const avg=(a:number[])=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
          const absAvg=(a:number[])=>avg(a.map(Math.abs));
          const deg=(x:number)=>x*180/Math.PI;

          function make(speedKmh:number){
            const sim=new Simulation({...DEFAULT_VEHICLE_CONFIG});
            sim.reset(0,0,0);
            const v=speedKmh/3.6;
            sim.vehicle.rigidBody.velocity={x:0,y:0,z:v};
            sim.vehicle.wheels.forEach(w=>w.reset(v));
            sim.vehicle.powertrain.gear=0;
            for(let i=0;i<60;i++) sim.stepExplicit(zero,1);
            return sim;
          }

          function brakeRun(mode:'OFF'|'SPORT'|'FULL', brake:number){
            const sim=make(100);
            sim.vehicle.driverAids.config.absMode=mode as any;
            const z0=sim.vehicle.getState().z;
            const rows:any[]=[];
            for(let i=0;i<120*8;i++){
              const s=sim.stepExplicit({...zero,brake},1);
              const mods=[...sim.vehicle.brakes.pressureModulators];
              rows.push({t:(i+1)*DT,speed:s.speedMs,longG:sim.vehicle.rigidBody.acceleration.z/G,
                slips:s.wheels.map(w=>w.slipRatio),fx:s.wheels.map(w=>w.forceVectorLong),fz:s.wheels.map(w=>w.suspensionForce),mods});
              if(s.speedMs<0.8) break;
            }
            const moving=rows.filter(r=>r.speed>5);
            const end=sim.vehicle.getState();
            return {mode,brake,stopDistanceM:Math.abs(end.z-z0),stopTimeS:rows.length*DT,endSpeedKmh:end.speedKmh,
              peakDecelG:Math.max(...moving.map(r=>Math.abs(r.longG))),meanDecelG:absAvg(moving.map(r=>r.longG)),
              meanWheelSlip:avg(moving.flatMap(r=>r.slips)),meanAbsWheelSlip:absAvg(moving.flatMap(r=>r.slips)),
              peakAbsWheelSlip:Math.max(...moving.flatMap(r=>r.slips.map((x:number)=>Math.abs(x)))),
              minPressure:Math.min(...moving.flatMap(r=>r.mods)),meanPressure:avg(moving.flatMap(r=>r.mods))};
          }

          function cornerRun(steer:number, speedKmh=80){
            const sim=make(speedKmh);
            const rows:any[]=[];
            for(let i=0;i<120*2;i++){
              const s=sim.stepExplicit({...zero,steer},1);
              rows.push({t:(i+1)*DT,speed:s.speedKmh,latG:sim.vehicle.rigidBody.acceleration.x/G,
                yawRate:s.yawRate,roll:sim.vehicle.rigidBody.getEuler().roll,actualSteer:s.actualSteerAngle,
                frontSlip:(s.wheels[0].slipAngle+s.wheels[1].slipAngle)/2,
                rearSlip:(s.wheels[2].slipAngle+s.wheels[3].slipAngle)/2,
                frontFz:s.wheels[0].suspensionForce+s.wheels[1].suspensionForce,
                rearFz:s.wheels[2].suspensionForce+s.wheels[3].suspensionForce});
            }
            const steady=rows.slice(-48);
            const latG=absAvg(steady.map(r=>r.latG));
            const frontSlip=absAvg(steady.map(r=>r.frontSlip));
            const rearSlip=absAvg(steady.map(r=>r.rearSlip));
            return {steerInput:steer,speedKmh,endingSpeedKmh:rows.at(-1).speed,steadyLatG:latG,
              yawRateDegS:deg(absAvg(steady.map(r=>r.yawRate))),rollDeg:deg(absAvg(steady.map(r=>r.roll))),
              actualSteerDeg:deg(absAvg(steady.map(r=>r.actualSteer))),frontSlipDeg:deg(frontSlip),rearSlipDeg:deg(rearSlip),
              slipAngleDeltaDeg:deg(frontSlip-rearSlip),yawGainDegSPerDeg:deg(absAvg(steady.map(r=>r.yawRate)))/Math.max(.01,deg(absAvg(steady.map(r=>r.actualSteer))))};
          }

          function trailBrake(){
            const sim=make(80);
            const steer=0.11;
            const pre:any[]=[];
            for(let i=0;i<120;i++){
              const s=sim.stepExplicit({...zero,steer},1);
              if(i>=72) pre.push({yaw:Math.abs(s.yawRate),latG:Math.abs(sim.vehicle.rigidBody.acceleration.x/G),front:s.wheels[0].suspensionForce+s.wheels[1].suspensionForce,rear:s.wheels[2].suspensionForce+s.wheels[3].suspensionForce});
            }
            const post:any[]=[];
            for(let i=0;i<72;i++){
              const s=sim.stepExplicit({...zero,steer,brake:0.22},1);
              post.push({t:(i+1)*DT,yaw:Math.abs(s.yawRate),latG:Math.abs(sim.vehicle.rigidBody.acceleration.x/G),longG:Math.abs(sim.vehicle.rigidBody.acceleration.z/G),front:s.wheels[0].suspensionForce+s.wheels[1].suspensionForce,rear:s.wheels[2].suspensionForce+s.wheels[3].suspensionForce,frontSlip:Math.abs((s.wheels[0].slipAngle+s.wheels[1].slipAngle)/2),rearSlip:Math.abs((s.wheels[2].slipAngle+s.wheels[3].slipAngle)/2)});
            }
            const p=post.slice(18,60);
            const preYaw=avg(pre.map(r=>r.yaw));
            return {preYawDegS:deg(preYaw),trailYawDegS:deg(avg(p.map(r=>r.yaw))),yawChangePct:(avg(p.map(r=>r.yaw))/preYaw-1)*100,
              trailLatG:avg(p.map(r=>r.latG)),trailLongG:avg(p.map(r=>r.longG)),frontLoadGainN:avg(p.map(r=>r.front))-avg(pre.map(r=>r.front)),rearLoadLossN:avg(pre.map(r=>r.rear))-avg(p.map(r=>r.rear)),
              frontSlipDeg:deg(avg(p.map(r=>r.frontSlip))),rearSlipDeg:deg(avg(p.map(r=>r.rearSlip))),maxYawDegS:deg(Math.max(...post.map(r=>r.yaw)))};
          }

          function runtimeConfigCheck(){
            const sim=make(0);
            const before={mass:sim.vehicle.rigidBody.config.mass,inertia:{...sim.vehicle.rigidBody.config.inertia}};
            const cfg={...DEFAULT_VEHICLE_CONFIG,mass:2050,centerOfGravityHeight:0.53,wheelbase:3.05,trackWidth:1.68,chassisRollInertia:800,chassisPitchInertia:2200};
            sim.setConfig(cfg as any);
            const after={mass:sim.vehicle.rigidBody.config.mass,inertia:{...sim.vehicle.rigidBody.config.inertia}};
            return {before,requested:{mass:cfg.mass},after,massUpdated:after.mass===cfg.mass};
          }

          const result={
            braking:[
              brakeRun('SPORT',0.45),brakeRun('SPORT',0.65),brakeRun('SPORT',0.85),brakeRun('SPORT',1.0),
              brakeRun('FULL',1.0),brakeRun('OFF',0.65),brakeRun('OFF',1.0)
            ],
            cornering:[0.035,0.06,0.09,0.12,0.15,0.18].map(s=>cornerRun(s)),
            trailBrake:trailBrake(),
            runtimeConfig:runtimeConfigCheck()
          };
          fs.writeFileSync('dynamics-calibration.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          TS
          npx tsx /tmp/dynamics.ts | tee dynamics-calibration.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamics-calibration
          path: |
            dynamics-calibration.json
            dynamics-calibration.log
          retention-days: 1
