name: Baseline main dynamics

on:
  push:
    branches:
      - agent/unsprung-mass-dynamics

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Main-branch M5 headless baseline
        run: |
          ./node_modules/.bin/tsx -e "import { DEFAULT_VEHICLE_CONFIG } from './src/physics/vehiclePresets.ts'; import { BMW_M5_2025_OVERRIDES } from './src/physics/m5G90.ts'; import { HeadlessTestRunner } from './src/physics/tests/HeadlessTestRunner.ts'; const config={...DEFAULT_VEHICLE_CONFIG,...BMW_M5_2025_OVERRIDES}; const results=HeadlessTestRunner.runAllTests(config as any); console.log(JSON.stringify(results.map(r=>({name:r.name,passed:r.passed,summary:r.summary,metrics:r.metrics})),null,2));"
