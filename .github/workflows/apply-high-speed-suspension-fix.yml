name: Apply high-speed suspension fix

on:
  push:
    branches:
      - fix/high-speed-suspension-separation

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply coordinate and terrain fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vehicle = Path('src/physics/Vehicle.ts')
          text = vehicle.read_text()
          old = "      heave: pos.y - (this.config.centerOfGravityHeight + 0.35),"
          new = "      // Heave is suspension/body motion relative to the local road, not world altitude.\n      heave: pos.y - cgSurface.elevation - (this.config.centerOfGravityHeight + 0.35),"
          assert old in text, 'Vehicle heave expression not found'
          vehicle.write_text(text.replace(old, new, 1))

          renderer = Path('src/graphics/carRenderer.ts')
          text = renderer.read_text()
          old = "    this.rootGroup.position.set(state.x, state.y, state.z);"
          new = "    // Root follows local road elevation. Chassis heave below is terrain-relative,\n    // preventing world altitude from being applied twice on hills/crests.\n    this.rootGroup.position.set(state.x, state.elevationHeight, state.z);"
          assert old in text, 'renderer root position expression not found'
          renderer.write_text(text.replace(old, new, 1))

          env = Path('src/graphics/environment.ts')
          text = env.read_text()
          old = "import { WheelState } from '../types';"
          new = "import { WheelState } from '../types';\nimport { ProvingGroundSurfaceProvider } from '../physics/SurfaceProvider';"
          assert old in text, 'environment import anchor not found'
          text = text.replace(old, new, 1)

          old = "  private smokeMat: THREE.MeshBasicMaterial;"
          new = "  private smokeMat: THREE.MeshBasicMaterial;\n  private readonly surfaceProvider = new ProvingGroundSurfaceProvider();"
          assert old in text, 'environment field anchor not found'
          text = text.replace(old, new, 1)

          old = "    const groundGeo = new THREE.PlaneGeometry(2600, 2600, 32, 32);\n    groundGeo.rotateX(-Math.PI / 2);"
          new = "    // Use enough longitudinal tessellation to visibly match the physics crest/dip.\n    const groundGeo = new THREE.PlaneGeometry(2600, 2600, 160, 260);\n    groundGeo.rotateX(-Math.PI / 2);\n\n    // Graphics and physics must sample the same road-height function. Otherwise the\n    // rigid body climbs an invisible hill while the rendered road remains flat.\n    const positions = groundGeo.attributes.position as THREE.BufferAttribute;\n    for (let i = 0; i < positions.count; i++) {\n      const x = positions.getX(i);\n      const z = positions.getZ(i);\n      positions.setY(i, this.surfaceProvider.sampleSurface(x, z).elevation);\n    }\n    positions.needsUpdate = true;\n    groundGeo.computeVertexNormals();"
          assert old in text, 'ground geometry anchor not found'
          text = text.replace(old, new, 1)

          old = "      dash.position.set(0, 0.016, z);"
          new = "      const road = this.surfaceProvider.sampleSurface(0, z);\n      dash.position.set(0, road.elevation + 0.016, z);\n      dash.rotation.x = -road.slopePitch;"
          assert old in text, 'center-line marking anchor not found'
          text = text.replace(old, new, 1)

          old = "    // Runway boundary lines\n    for (const x of [-18, 18]) {\n      const lineGeo = new THREE.PlaneGeometry(0.55, 1000);\n      lineGeo.rotateX(-Math.PI / 2);\n      const line = new THREE.Mesh(lineGeo, whiteMat);\n      line.position.set(x, 0.016, 0);\n      markingsGroup.add(line);\n    }"
          new = "    // Runway boundary lines are segmented so they can follow the same crest/dip.\n    for (const x of [-18, 18]) {\n      for (let z = -496; z <= 496; z += 8) {\n        const lineGeo = new THREE.PlaneGeometry(0.55, 8.2);\n        lineGeo.rotateX(-Math.PI / 2);\n        const line = new THREE.Mesh(lineGeo, whiteMat);\n        const road = this.surfaceProvider.sampleSurface(x, z);\n        line.position.set(x, road.elevation + 0.016, z);\n        line.rotation.x = -road.slopePitch;\n        markingsGroup.add(line);\n      }\n    }"
          assert old in text, 'runway boundary block not found'
          text = text.replace(old, new, 1)

          old = "      trap.position.set(0, 0.018, zPos);"
          new = "      const road = this.surfaceProvider.sampleSurface(0, zPos);\n      trap.position.set(0, road.elevation + 0.018, zPos);\n      trap.rotation.x = -road.slopePitch;"
          assert old in text, 'trap-line marking anchor not found'
          text = text.replace(old, new, 1)

          old = "      group.position.set(x, 0, z);"
          new = "      group.position.set(x, this.surfaceProvider.sampleSurface(x, z).elevation, z);"
          assert old in text, 'cone terrain anchor not found'
          text = text.replace(old, new, 1)

          env.write_text(text)
          PY

      - name: Install dependencies
        run: npm install
      - name: Run suspension regression
        run: npm run test:suspension
      - name: Production build
        run: npm run build
      - name: Run 216 km/h flat and crest diagnostic
        run: |
          git fetch origin test/high-speed-suspension:test-high-speed-suspension
          git show test-high-speed-suspension:src/physics/tests/HighSpeedSuspensionDiagnostic.ts > src/physics/tests/HighSpeedSuspensionDiagnostic.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/physics/tests/HighSpeedSuspensionDiagnostic.ts')
          s = p.read_text()
          # New renderer root is terrain elevation and new heave is terrain-relative.
          s = s.replace(
              "    // Current renderer: root gets state.y, then chassis gets state.heave again.\n    const chassisOriginWorldY = state.y + state.heave;\n    const wheelCentersWorldY = state.wheels.map((w: any) => state.y + 0.33 + w.verticalTravelM - w.tireSquishM);",
              "    // Fixed renderer: root follows terrain; heave is terrain-relative.\n    const chassisOriginWorldY = state.elevationHeight + state.heave;\n    const wheelCentersWorldY = state.wheels.map((w: any) => state.elevationHeight + 0.33 + w.verticalTravelM - w.tireSquishM);"
          )
          p.write_text(s)
          PY
          npx tsx src/physics/tests/HighSpeedSuspensionDiagnostic.ts
          rm src/physics/tests/HighSpeedSuspensionDiagnostic.ts
      - name: Assert the separation regression is gone
        run: |
          grep -q "heave: pos.y - cgSurface.elevation" src/physics/Vehicle.ts
          grep -q "rootGroup.position.set(state.x, state.elevationHeight, state.z)" src/graphics/carRenderer.ts
          grep -q "surfaceProvider.sampleSurface(x, z).elevation" src/graphics/environment.ts
      - name: Commit tested fix
        run: |
          rm .github/workflows/apply-high-speed-suspension-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/Vehicle.ts src/graphics/carRenderer.ts src/graphics/environment.ts .github/workflows/apply-high-speed-suspension-fix.yml
          git commit -m "Fix high-speed suspension body separation"
          git push origin HEAD:fix/high-speed-suspension-separation
