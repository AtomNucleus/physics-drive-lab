name: Validate unsprung mass dynamics

on:
  push:
    branches:
      - agent/unsprung-mass-dynamics

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Suspension and unsprung behavior tests
        run: npm run test:suspension
      - name: Production build
        run: npm run build
