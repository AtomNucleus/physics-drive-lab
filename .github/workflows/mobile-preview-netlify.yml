name: Mobile Preview Netlify Deploy

on:
  push:
    branches:
      - agent/mobile-mode-touch-controls-20260816
    paths:
      - .github/workflows/mobile-preview-netlify.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Deploy anonymously to Netlify
        run: npx --yes netlify-cli@latest deploy --allow-anonymous --dir=dist --json
