name: Anonymous Netlify deploy

on:
  push:
    branches:
      - deploy/netlify-anonymous-20260816

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
      - name: Deploy anonymously to Netlify
        run: npx --yes netlify-cli@latest deploy --dir=dist --allow-anonymous
