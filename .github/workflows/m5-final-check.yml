name: Final M5 Production Check

on:
  push:
    branches: [agent/dynamic-tire-load-transfer]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install
      - name: Production build
        run: npm run build
      - name: Exact-preset dynamics check
        run: |
          cat > /tmp/m5-final.ts <<'TS'
          import { Simulation } from '/home/runner/work/physics-drive-lab/physics-drive-lab/src/physics/Simulation.ts';
          import { DEFAULT_VEHICLE_CONFIG } from '/home/runner/work/physics-drive-lab/physics-drive-lab/src/physics/vehiclePresets.ts';
          import { BMW_M5_2025_OVERRIDES, BMW_M5_2025_STANDING_TARGETS } from '/home/runner/work/physics-drive-lab/physics-drive-lab/src/physics/m5G90.ts';
          const DT=1/120, MPH=2.2369362921, G=9.81, FT=3.28084;
          const cfg:any={...DEFAULT_VEHICLE_CONFIG,...BMW_M5_2025_OVERRIDES};
          const zero:any={throttle:0,brake:0,steer:0,handbrake:false,shiftUp:false,shiftDown:false};
          const avg=(a:number[])=>a.reduce((x,y)=>x+y,0)/Math.max(1,a.length);
          function staticLoad(){const s=new Simulation(cfg);s.reset(0,0,0);for(let i=0;i<360;i++)s.stepExplicit(zero,1);const st=s.vehicle.getState(),l=st.wheels.map((w:any)=>w.suspensionForce);return {frontFraction:(l[0]+l[1])/l.reduce((a:number,b:number)=>a+b,0),loads:l};}
          function accel(){const s=new Simulation(cfg);s.reset(0,0,0);s.vehicle.powertrain.isAutomatic=true;for(let i=0;i<180;i++)s.stepExplicit({...zero,throttle:1,brake:1},1);const z0=s.vehicle.getState().z;let t30=null as number|null,t60=null as number|null,t100=null as number|null,q=null as number|null,trap=null as number|null,maxSlip=0;for(let i=0;i<1800;i++){const st=s.stepExplicit({...zero,throttle:1},1),t=(i+1)*DT,mph=st.speedMs*MPH;maxSlip=Math.max(maxSlip,...st.wheels.map((w:any)=>Math.max(0,w.slipRatio)));if(t30===null&&mph>=30)t30=t;if(t60===null&&mph>=60)t60=t;if(t100===null&&mph>=100)t100=t;if(q===null&&Math.abs(st.z-z0)>=402.336){q=t;trap=mph;}if(st.rpm>6800&&s.vehicle.powertrain.gear<8)s.vehicle.powertrain.shiftUp();if(t100!==null&&q!==null)break;}return {t30,t60,t100,quarterMile:q,trapMph:trap,maxSlip};}
          function brake(mph0:number){const s=new Simulation(cfg);s.reset(0,0,0);const v=mph0/MPH;s.vehicle.rigidBody.velocity={x:0,y:0,z:v};s.vehicle.wheels.forEach((w:any)=>w.reset(v));s.vehicle.powertrain.gear=0;for(let i=0;i<12;i++)s.stepExplicit(zero,1);const z0=s.vehicle.getState().z,sl:number[]=[],pr:number[]=[];for(let i=0;i<1800;i++){const st=s.stepExplicit({...zero,brake:1},1);if(st.speedMs>2){sl.push(...st.wheels.map((w:any)=>Math.max(0,-w.slipRatio)));pr.push(...s.vehicle.brakes.pressureModulators);}if(st.speedMs<.15)break;}return {distanceFt:Math.abs(s.vehicle.getState().z-z0)*FT,meanSlip:avg(sl),meanPressure:avg(pr)};}
          function skidpad(){const target=46.9/MPH,rows:any[]=[];for(const steer of [.20,.22,.24,.26,.28,.30]){const s=new Simulation(cfg);s.reset(0,0,0);s.vehicle.rigidBody.velocity={x:0,y:0,z:target};s.vehicle.wheels.forEach((w:any)=>w.reset(target));s.vehicle.powertrain.isAutomatic=false;s.vehicle.powertrain.gear=4;s.vehicle.powertrain.engineRpm=(target/cfg.wheelRadius)*cfg.forwardGearRatios[3]*cfg.finalDriveRatio*30/Math.PI;const gs:number[]=[],vs:number[]=[];for(let i=0;i<600;i++){const v=Math.abs(s.vehicle.rigidBody.getLocalVelocity().z),e=target-v,th=Math.max(0,Math.min(.55,.12+e*.14)),br=e<-.6?Math.min(.2,-e*.04):0;const st=s.stepExplicit({...zero,steer,throttle:th,brake:br},1);if(i>=420){gs.push(Math.abs(s.vehicle.rigidBody.acceleration.x/G));vs.push(st.speedMs*MPH);}}rows.push({steer,latG:avg(gs),speedMph:avg(vs)});}return {rows,peakG:Math.max(...rows.map(r=>r.latG))};}
          console.log(JSON.stringify({config:{brakeForce:cfg.brakeForce,brakeBiasFront:cfg.brakeBiasFront,absMode:cfg.absMode,fill:cfg.lowSpeedTorqueFillNm,fade:cfg.torqueFillFadeRpm,shiftSec:cfg.shiftDurationSec,shiftTorque:cfg.shiftTorqueMultiplier,longSigma:cfg.longitudinalRelaxationLength},targets:BMW_M5_2025_STANDING_TARGETS,staticLoad:staticLoad(),acceleration:accel(),brake70:brake(70),brake100:brake(100),skidpad:skidpad()},null,2));
          TS
          npx tsx /tmp/m5-final.ts
